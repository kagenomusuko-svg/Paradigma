name: Migrar version ensamblador Fase 10

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - ".github/workflows/_migrar-version-ensamblador-fase10.yml"

permissions:
  contents: write

jobs:
  migrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Versionar matriz y productor del ensamblador
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new, expected=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: esperado {expected} x {old!r}; encontrado {n}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          asm='analista/motores/ensamblador_maestro_obra_fase10.py'
          rep(asm,'MOTOR_VERSION="1.2.0"','MOTOR_VERSION="1.2.1"')
          rep(asm,'FIXED={"conceptos_apariciones":"1.3.0","definiciones":"1.3.0","afirmaciones":"1.2.0","relaciones_explicitas":"1.2.0","limitadores":"1.1.0"}',
                  'FIXED={"conceptos_apariciones":"1.3.1","definiciones":"1.3.0","afirmaciones":"1.2.0","relaciones_explicitas":"1.2.1","limitadores":"1.1.1"}')
          rep(asm,'"version":"ensamblador_maestro_obra_fase10/1.2.0"','"version":"ensamblador_maestro_obra_fase10/1.2.1"')
          rep('analista/pruebas/validar_obra_fase10.py','{"motor":"ensamblador_maestro_obra_fase10","version":"1.2.0"}',
              '{"motor":"ensamblador_maestro_obra_fase10","version":"1.2.1"}')
          rep('analista/pruebas/validar_cierre_fase10.py','{"motor":"ensamblador_maestro_obra_fase10","version":"1.2.0"}',
              '{"motor":"ensamblador_maestro_obra_fase10","version":"1.2.1"}')

          stale={
            asm:['MOTOR_VERSION="1.2.0"','"conceptos_apariciones":"1.3.0"','"relaciones_explicitas":"1.2.0"','"limitadores":"1.1.0"','ensamblador_maestro_obra_fase10/1.2.0'],
            'analista/pruebas/validar_obra_fase10.py':['{"motor":"ensamblador_maestro_obra_fase10","version":"1.2.0"}'],
            'analista/pruebas/validar_cierre_fase10.py':['{"motor":"ensamblador_maestro_obra_fase10","version":"1.2.0"}'],
          }
          for path,vals in stale.items():
              text=Path(path).read_text(encoding='utf-8'); bad=[x for x in vals if x in text]
              if bad: raise SystemExit(f'{path}: etiquetas obsoletas: {bad}')
          PY
      - name: Retirar migrador y persistir
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          rm .github/workflows/_migrar-version-ensamblador-fase10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Versionar ensamblador de Fase 10"
          git push origin HEAD:"${TARGET_BRANCH}"
