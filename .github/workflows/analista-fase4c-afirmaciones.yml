name: Analista Fase 4C - afirmaciones

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/motores/afirmaciones.py"
      - "analista/pruebas/validar_afirmaciones_fase4c.py"
      - "analista/esquema/**"
      - "analista/generado/unidades.jsonl"
      - "analisis/generado/sobre-la-pasion/afirmaciones-candidatas.jsonl"
      - ".github/workflows/analista-fase4c-afirmaciones.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  afirmaciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - name: Generar afirmaciones candidatas reales
        run: python analista/motores/afirmaciones.py
      - name: Validar estatus enunciativo y clausura
        run: python analista/pruebas/validar_afirmaciones_fase4c.py
      - uses: actions/upload-artifact@v4
        with:
          name: analista-fase4c-afirmaciones
          path: |
            analista/generado/afirmaciones-candidatas.jsonl
            analista/generado/cobertura-afirmaciones.jsonl
          if-no-files-found: error
      - name: Persistir productos deterministas
        if: github.actor != 'github-actions[bot]'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/afirmaciones-candidatas.jsonl analista/generado/cobertura-afirmaciones.jsonl)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/afirmaciones-candidatas.jsonl analista/generado/cobertura-afirmaciones.jsonl
          git commit -m "Generar afirmaciones candidatas de Fase 4C"
          git push origin HEAD:"${TARGET_BRANCH}"
