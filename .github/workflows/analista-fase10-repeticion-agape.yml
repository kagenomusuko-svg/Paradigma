name: Analista Fase 10 - repetición Ágape

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeticion-agape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema

      - name: Validar cadena intraobra de Ágape con el validador genérico
        run: python analista/pruebas/validar_cadena_agape_fase10.py

      - name: Publicar replay de Ágape
        uses: actions/upload-artifact@v4
        with:
          name: analista-fase10-agape-replay
          path: |
            analista/generado/fase10/inventario-obras.json
            analista/generado/obras/FUE-2C28F35DD6CF/
            analista/generado/maestros/FUE-2C28F35DD6CF.json
            analista/generado/maestros/FUE-2C28F35DD6CF.json.sha256
          if-no-files-found: error
