name: Pulir temporalmente Caos capítulo 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pulir-caos-cap4.yml'

permissions:
  contents: write

jobs:
  pulir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cerrar ortotipografía y rayas residuales
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('corpus/normalización/caos/capitulo-04.md')
          t = p.read_text(encoding='utf-8')

          replacements = {
              'el ego es el colapso —el evento que ocurre': 'el ego es el colapso: el evento que ocurre',
              'Es una estructura autopoiética —un sistema que se produce': 'Es una estructura autopoiética: un sistema que se produce',
              'La respuesta debe ser no —pero no un no trivial.': 'La respuesta debe ser no, pero no un no trivial.',
              'cuyas células mutaron —no hay allí primera mediación': 'cuyas células mutaron: no hay allí primera mediación',
              'es completamente ajeno a cualquier ego humano —ocurre según': 'es completamente ajeno a cualquier ego humano; ocurre según',
              'como accidentes —como modificaciones del campo, no como operaciones causales directas.': 'como accidentes, como modificaciones del campo, no como operaciones causales directas.',
              'entre sustancia y accidentes —como si los accidentes fueran propiedades': 'entre sustancia y accidentes, como si los accidentes fueran propiedades',
              'Pensemos en el determinismo duro —la posición filosófica que sostiene': 'Pensemos en el determinismo duro, la posición filosófica que sostiene',
              'sean causalmente relevantes para los actos del ego —lo son, de manera profunda y documentada.': 'sean causalmente relevantes para los actos del ego; lo son, de manera profunda y documentada.',
              'modifiquen el campo de acción del ego —lo hacen, de manera igualmente profunda y documentada.': 'modifiquen el campo de acción del ego; lo hacen, de manera igualmente profunda y documentada.',
              'sigue siendo el sujeto que colapsa desde ese campo —sus colapsos son suyos,': 'sigue siendo el sujeto que colapsa desde ese campo; sus colapsos son suyos,',
              'como justo —capaz de reconocer dónde el campo fue modificado': 'como justo, capaz de reconocer dónde el campo fue modificado',
              'ante quienes no son capaces de agencia plena —el niño muy pequeño, el demente severo, quien actúa bajo coacción extrema.': 'ante quienes no son capaces de agencia plena (el niño muy pequeño, el demente severo, quien actúa bajo coacción extrema).',
              'no sean responsables de nada — mientras haya campo de acción, hay ego y hay responsabilidad posible.': 'no sean responsables de nada; mientras haya campo de acción, hay ego y hay responsabilidad posible.',
              'Ahora la integral incluye el accidente —no como un colapso propio, sino como una determinación del campo': 'Ahora la integral incluye el accidente, no como un colapso propio, sino como una determinación del campo',
              'y la «ipseidad» —la identidad del sujeto que se mantiene a sí mismo mediante la promesa y el compromiso.': 'y la «ipseidad», la identidad del sujeto que se mantiene a sí mismo mediante la promesa y el compromiso.',
              'a la relación entre el ser humano y Dios —si Dios existe en el sentido de una escala de colapso superior.': 'a la relación entre el ser humano y Dios, si Dios existe en el sentido de una escala de colapso superior.',
              'son partes de ella en algún sentido —pero la sustancia no es ningún modo particular': 'son partes de ella en algún sentido; pero la sustancia no es ningún modo particular',
              'el ego humano no colapsa directamente —sino a través de un proceso de mediación': 'el ego humano no colapsa directamente, sino a través de un proceso de mediación',
              'Pero no sustituyen mi primera mediación.': 'Pero no sustituye mi primera mediación.',
              'La primera persona no se reduce a la tercera, aunque la segunda siempre se realice sobre la base de la primera.': 'La primera persona no se reduce a la tercera, aunque la primera siempre se realice sobre la base de la tercera.',
              'poder-ser-esto-o-aquello': 'poder ser esto o aquello',
              'ser-esto-y-no-aquello': 'ser esto y no aquello',
          }
          for a,b in replacements.items():
              if a in t:
                  t = t.replace(a,b)

          # Cualquier raya restante, salvo la atribución del epígrafe, debe quedar identificada y no pasar silenciosamente.
          dash_lines=[]
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line and not line.startswith('«Somos parte del todo, pero el todo no es ninguna de sus partes.» —Miguel Hilario Olvera Aguilar'):
                  dash_lines.append((i,line))
          print('UNRESOLVED_DASH_LINES:', len(dash_lines))
          for i,line in dash_lines:
              print(f'DASH {i}: {line[:1800]}')
          if dash_lines:
              raise SystemExit('Quedaron rayas de prosa sin resolver.')

          refs = [int(x) for x in re.findall(r'href="#fn-main-(\d+)"', t)]
          notes = [int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>', t)]
          print('MISSING_REFERENCED_NOTES:', sorted(set(refs)-set(notes)))
          print('ORPHAN_NOTES:', sorted(set(notes)-set(refs)))
          print('EM_DASHES:', t.count('—'), 'EN_DASHES:', t.count('–'))
          print('SUSPICIOUS_COMPOUNDS:', sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b', t))))
          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)):
              raise SystemExit('La auditoría de notas falló.')
          if '–' in t or '�' in t or '□' in t:
              raise SystemExit('Persisten caracteres prohibidos o corruptos.')

          p.write_text(t, encoding='utf-8')

      - name: Guardar pulido y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pulir-caos-cap4.yml
          git add 'corpus/normalización/caos/capitulo-04.md'
          git commit -m '[MANT][NORMALIZACION] Pulir ortotipografía de Caos capítulo 4'
          git push
