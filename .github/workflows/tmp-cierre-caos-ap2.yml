name: Cerrar Caos apéndice 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cierre-caos-ap2.yml'

permissions:
  contents: write

jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correcciones finales y validación
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('corpus/normalización/caos/apendice-02.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
              'Una vez que el estado |ψ⟩ ha colapsado en el autovector |aₙ⟩, el estado\n\nanterior no puede recuperarse',
              'Una vez que el estado |ψ⟩ ha colapsado en el autovector |aₙ⟩, el estado anterior no puede recuperarse'
          )
          t=t.replace('Pero en\n\nel experimento real', 'Pero en el experimento real')
          t=t.replace('teoría que explain los resultados cuánticos', 'teoría que explica los resultados cuánticos')
          t=t.replace('Heisenberg derive la relación', 'Heisenberg deriva la relación')

          refs=[int(x) for x in re.findall(r'href="#fn-app-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-app-(\d+)"></a>',t)]
          edrefs=set(re.findall(r'href="#(fn-ed-ap2-[^"]+)"',t))
          ednotes=set(re.findall(r'<a id="(fn-ed-ap2-[^"]+)"></a>',t))
          visible_quotes=[]
          for i,line in enumerate(t.splitlines(),1):
              parts=re.split(r'(<[^>]+>)',line)
              visible=''.join(part for part in parts if not (part.startswith('<') and part.endswith('>')))
              if '"' in visible: visible_quotes.append((i,visible))
          bad_phrases=['teoría que explain','Heisenberg derive','Pero en\n\nel experimento real','el estado\n\nanterior no puede recuperarse']
          bad=[x for x in bad_phrases if x in t]
          print('BAD_PHRASES',bad)
          print('PROHIBITED_CHARS',{c:t.count(c) for c in ['—','–','□','�']})
          print('VISIBLE_QUOTES',visible_quotes)
          print('MISSING',sorted(set(refs)-set(notes)),'ORPHAN',sorted(set(notes)-set(refs)))
          print('MISSING_13_33',[n for n in range(13,34) if n not in notes])
          print('MISSING_ED',sorted(edrefs-ednotes),'ORPHAN_ED',sorted(ednotes-edrefs))
          if bad or visible_quotes or any(c in t for c in ['—','–','□','�']):
              raise SystemExit('Persisten residuos ortotipográficos.')
          if set(refs)!=set(notes) or [n for n in range(13,34) if n not in notes] or edrefs!=ednotes:
              raise SystemExit('Auditoría de notas falló.')
          p.write_text(t,encoding='utf-8')
      - name: Guardar cierre y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-cierre-caos-ap2.yml
          git add 'corpus/normalización/caos/apendice-02.md'
          git commit -m '[MANT][NORMALIZACION] Cerrar Caos apéndice 2'
          git push
