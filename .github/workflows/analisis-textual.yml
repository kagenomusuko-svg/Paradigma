name: Analisis textual auditable

on:
  push:
    branches:
      - main
      - analisis-textual-v0.1
    paths:
      - "corpus/libros/afrodita-areia/01-sobre-la-pasion/**"
      - "analisis/**"
      - "scripts/analisis_textual.py"
      - "scripts/auditar_analisis.py"
      - ".github/workflows/analisis-textual.yml"
  pull_request:
    branches:
      - main
    paths:
      - "corpus/libros/afrodita-areia/01-sobre-la-pasion/**"
      - "analisis/**"
      - "scripts/analisis_textual.py"
      - "scripts/auditar_analisis.py"
      - ".github/workflows/analisis-textual.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  piloto-sobre-la-pasion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extraer evidencia y candidatos
        run: python scripts/analisis_textual.py --config analisis/config/piloto-sobre-la-pasion.json

      - name: Auditar invariantes
        run: python scripts/auditar_analisis.py --dir analisis/generado/sobre-la-pasion

      - name: Publicar salida para revisión
        uses: actions/upload-artifact@v4
        with:
          name: analisis-sobre-la-pasion
          path: analisis/generado/sobre-la-pasion
          if-no-files-found: error

      - name: Persistir salida determinista
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- analisis/generado; then
            echo "Sin cambios generados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analisis/generado
          git commit -m "Regenerar análisis textual piloto"
          git push
