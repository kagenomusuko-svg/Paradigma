name: Auditar temporalmente Caos capítulo 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auditar-caos-cap5.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auditar capítulo y mapa
        shell: python
        run: |
          from pathlib import Path
          import json, re
          p = Path('corpus/libros/caos/capitulo-05.md')
          t = p.read_text(encoding='utf-8')
          refs = [int(x) for x in re.findall(r'href="#fn-main-(\d+)"', t)]
          plain = [int(x) for x in re.findall(r'<sup>(\d+)</sup>', t)]
          notes = [int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>', t)]
          print('CHARS', len(t), 'LINES', len(t.splitlines()))
          print('LINKED_REFS', sorted(set(refs)))
          print('PLAIN_SUP_REFS', plain)
          print('NOTES', notes)
          print('MISSING_LINKED', sorted(set(refs)-set(notes)))
          print('PLAIN_WITHOUT_NOTE', sorted(set(plain)-set(notes)))
          print('ORPHAN_NOTES', sorted(set(notes)-set(refs)-set(plain)))
          print('EM_DASHES', t.count('—'), 'EN_DASHES', t.count('–'))
          print('REPLACEMENT', t.count('�'), 'BOX', t.count('□'))
          print('SUSPICIOUS_COMPOUNDS', sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b', t))))
          for term in ('primera mediación','mediación neutral','responsabilidad','habitus','animal','lenguaje'):
              print('TERM', term, t.lower().count(term.lower()))
          mapa = json.loads(Path('mapa/mapa-maestro.json').read_text(encoding='utf-8'))
          for i,item in enumerate(mapa.get('review_queue', [])):
              dump=json.dumps(item, ensure_ascii=False).lower()
              if 'ev.caos' in dump and any(k in dump for k in ('mediaci','responsab','habitus','animal','lenguaje','intencional')):
                  print('MAP_REVIEW', i, json.dumps(item, ensure_ascii=False))
      - name: Retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-auditar-caos-cap5.yml
          git commit -m '[MANT][NORMALIZACION] Retirar auditoría temporal de Caos capítulo 5'
          git push