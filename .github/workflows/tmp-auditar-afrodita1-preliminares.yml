name: Auditar temporalmente preliminares de Afrodita Areia I

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auditar-afrodita1-preliminares.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar mapa y estructura
        shell: python
        run: |
          from pathlib import Path
          import json, re, unicodedata

          def fold(s):
              return ''.join(c for c in unicodedata.normalize('NFD', str(s).lower()) if unicodedata.category(c) != 'Mn')

          mp = json.loads(Path('mapa/mapa-maestro.json').read_text(encoding='utf-8'))
          keys = ['afrodita areia', 'sobre la pasion', 'mediacion fanes', 'mediacion bis', 'mediacion neutral', 'pasion', 'ego integral']
          hits=[]
          def walk(x, path='root'):
              if isinstance(x, dict):
                  blob=fold(json.dumps(x, ensure_ascii=False))
                  ident=str(x.get('id') or x.get('review_id') or x.get('name') or '')
                  if any(k in blob for k in keys) and (ident.startswith('review.') or 'review' in path.lower()):
                      hits.append((path, x))
                  for k,v in x.items(): walk(v, path+'.'+str(k))
              elif isinstance(x, list):
                  for i,v in enumerate(x): walk(v, path+f'[{i}]')
          walk(mp)
          print('REVISIONES_RELEVANTES', len(hits))
          seen=set()
          for path,obj in hits:
              ident=obj.get('id') or obj.get('review_id') or obj.get('name') or path
              if ident in seen: continue
              seen.add(ident)
              print('REVIEW', ident)
              for field in ['status','subject','question','why','summary','blocking','blocking_for','resolution']:
                  if field in obj:
                      val=obj[field]
                      print(' ', field, ':', str(val)[:1800])

          # Confirmar que el apéndice A existe dentro del segmento de capítulo 16.
          c16=Path('corpus/libros/afrodita-areia/01-sobre-la-pasion/capitulo-16.md').read_text(encoding='utf-8')
          print('APENDICE_A_EN_CAP16', 'Apéndice A El aego' in c16)

          # Auditoría simple de preliminares normalizados.
          p=Path('corpus/normalización/afrodita-areia/01-sobre-la-pasion/00-preliminares.md')
          t=p.read_text(encoding='utf-8')
          print('PRELIM_CHARS', len(t))
          print('EM_DASH', t.count('—'))
          print('EN_DASH', t.count('–'))
          print('BOX', t.count('□'))
          print('REPLACEMENT', t.count('�'))
          print('MAP_SCAFFOLD', len(re.findall(r'mapa maestro|review_queue|pending_|adjudic', t, flags=re.I)))
          assert 'Apéndice A.' in t and 'Apéndice B.' in t and 'Apéndice C.' in t
          assert t.count('–') == 0 and t.count('□') == 0 and t.count('�') == 0
          assert not re.search(r'mapa maestro|review_queue|pending_|adjudic', t, flags=re.I)
      - name: Retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-auditar-afrodita1-preliminares.yml
          git commit -m '[MANT] Retirar auditoría temporal de Afrodita Areia I'
          git push
