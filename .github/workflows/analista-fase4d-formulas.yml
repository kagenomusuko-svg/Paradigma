name: Analista Fase 4D - formulas

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/motores/formulas.py"
      - "analista/pruebas/validar_formulas_fase4d.py"
      - "analista/esquema/**"
      - "analista/generado/unidades.jsonl"
      - ".github/workflows/analista-fase4d-formulas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formulas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - name: Generar fórmulas candidatas reales
        run: python analista/motores/formulas.py
      - name: Validar integridad y contexto
        run: python analista/pruebas/validar_formulas_fase4d.py
      - uses: actions/upload-artifact@v4
        with:
          name: analista-fase4d-formulas
          path: |
            analista/generado/formulas-candidatas.jsonl
            analista/generado/cobertura-formulas.jsonl
          if-no-files-found: error
      - name: Persistir productos deterministas
        if: github.actor != 'github-actions[bot]'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/formulas-candidatas.jsonl analista/generado/cobertura-formulas.jsonl)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/formulas-candidatas.jsonl analista/generado/cobertura-formulas.jsonl
          git commit -m "Generar fórmulas candidatas de Fase 4D"
          git push origin HEAD:"${TARGET_BRANCH}"
