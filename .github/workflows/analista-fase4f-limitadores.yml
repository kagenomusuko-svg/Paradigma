name: Analista Fase 4F - limitadores

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/motores/limitadores.py"
      - "analista/pruebas/validar_limitadores_fase4f.py"
      - "analista/esquema/**"
      - "analista/generado/unidades.jsonl"
      - "corpus/libros/afrodita-areia/01-sobre-la-pasion/**"
      - ".github/workflows/analista-fase4f-limitadores.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limitadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - name: Generar limitadores reales
        run: python analista/motores/limitadores.py
      - name: Validar clausura y cobertura de 4F
        run: python analista/pruebas/validar_limitadores_fase4f.py
      - uses: actions/upload-artifact@v4
        with:
          name: analista-fase4f-limitadores
          path: |
            analista/generado/distinciones.jsonl
            analista/generado/negaciones.jsonl
            analista/generado/excepciones.jsonl
            analista/generado/restricciones-alcance.jsonl
            analista/generado/cobertura-limitadores.jsonl
          if-no-files-found: error
      - name: Persistir productos deterministas
        if: github.actor != 'github-actions[bot]'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/distinciones.jsonl analista/generado/negaciones.jsonl analista/generado/excepciones.jsonl analista/generado/restricciones-alcance.jsonl analista/generado/cobertura-limitadores.jsonl)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/distinciones.jsonl analista/generado/negaciones.jsonl analista/generado/excepciones.jsonl analista/generado/restricciones-alcance.jsonl analista/generado/cobertura-limitadores.jsonl
          git commit -m "Generar limitadores de Fase 4F"
          git push origin HEAD:"${TARGET_BRANCH}"
