name: Cerrar Caos apéndice 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cierre-caos-ap1.yml'

permissions:
  contents: write

jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correcciones ortotipográficas finales
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('corpus/normalización/caos/apendice-01.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('el «valor» de ningún colapso individual', 'el «valor» de ningún colapso individual')
          t=t.replace('el "valor" de ningún colapso individual', 'el «valor» de ningún colapso individual')
          t=t.replace('El espacio topológico más general abstracto la noción de «proximidad»', 'El espacio topológico más general abstrae la noción de «proximidad»')

          # Comprobar que no quedan comillas rectas en texto visible fuera de etiquetas HTML.
          visible_quotes=[]
          for i,line in enumerate(t.splitlines(),1):
              parts=re.split(r'(<[^>]+>)',line)
              visible=''.join(part for part in parts if not (part.startswith('<') and part.endswith('>')))
              if '"' in visible:
                  visible_quotes.append((i,visible))
          refs=[int(x) for x in re.findall(r'href="#fn-app-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-app-(\d+)"></a>',t)]
          edrefs=set(re.findall(r'href="#(fn-ed-ap1-[^"]+)"',t))
          ednotes=set(re.findall(r'<a id="(fn-ed-ap1-[^"]+)"></a>',t))
          print('VISIBLE_STRAIGHT_QUOTES',visible_quotes)
          print('PROHIBITED_CHARS', {c:t.count(c) for c in ['—','–','□','�']})
          print('MISSING_APP',sorted(set(refs)-set(notes)),'ORPHAN_APP',sorted(set(notes)-set(refs)))
          print('MISSING_ED',sorted(edrefs-ednotes),'ORPHAN_ED',sorted(ednotes-edrefs))
          if visible_quotes or any(c in t for c in ['—','–','□','�']):
              raise SystemExit('Persisten residuos ortotipográficos.')
          if set(refs)!=set(notes) or [n for n in range(1,13) if n not in notes] or edrefs!=ednotes:
              raise SystemExit('Auditoría de notas falló.')
          p.write_text(t,encoding='utf-8')
      - name: Guardar cierre y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-cierre-caos-ap1.yml
          git add 'corpus/normalización/caos/apendice-01.md'
          git commit -m '[MANT][NORMALIZACION] Cerrar Caos apéndice 1'
          git push
