name: Normalizar temporalmente Caos capítulo 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalizar-caos-cap6.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalizar capítulo y reconstruir notas faltantes
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata
          src=Path('corpus/libros/caos/capitulo-06.md')
          dst=Path('corpus/normalización/caos/capitulo-06.md')
          t=unicodedata.normalize('NFC',src.read_text(encoding='utf-8'))

          t=t.replace(
              '*La fórmula del ego «No basta con querer. No basta con hacer. El ego es lo que ocurre entre ambos —y lo que ocurre después.»* — Miguel Hilario Olvera Aguilar',
              '*La fórmula del ego*\n\n«No basta con querer. No basta con hacer. El ego es lo que ocurre entre ambos y lo que ocurre después.» —Miguel Hilario Olvera Aguilar'
          )

          corrections={
              'la análisis cognitivista':'el análisis cognitivista',
              'esa definitiveidad':'esa definitividad',
              'cambia el pregunta':'cambia la pregunta',
              'acraсia':'acrasia',
              'pre-reflexiva':'prerreflexiva',
              'pre-reflexivos':'prerreflexivos',
              'función-ego':'función del ego',
              ' — ':' — ',
          }
          for a,b in corrections.items(): t=t.replace(a,b)

          # Convertir incisos cerrados con raya en paréntesis, sin tocar la atribución del epígrafe.
          inciso=re.compile(r'\s—\s*([^—\n]{1,600}?)\s*—(?=[,.;:?!)]|\s)')
          while inciso.search(t):
              t=inciso.sub(lambda m:' ('+m.group(1).strip()+')',t)

          # Comillas españolas fuera de etiquetas HTML.
          def quotes_line(line):
              out=[]; in_tag=False; opening=True
              for ch in line:
                  if ch=='<': in_tag=True
                  if ch=='"' and not in_tag:
                      out.append('«' if opening else '»'); opening=not opening
                  else: out.append(ch)
                  if ch=='>': in_tag=False
              return ''.join(out)
          t='\n'.join(quotes_line(line) for line in t.split('\n'))

          # Quitar numeración plana duplicada de las notas existentes.
          t=re.sub(r'(<a id="fn-main-(\d+)"></a><sup>\2</sup>)\s+\d+\s+',r'\1 ',t)

          # Reconstruir tres llamadas y notas perdidas sin inventar bibliografía.
          for n in (149,150,153):
              t=t.replace(f'<sup>{n}</sup>',f'<sup id="fnref-main-{n}"><a href="#fn-main-{n}">{n}</a></sup>')
          rebuilt=(
              '<a id="fn-main-149"></a><sup>149</sup> Véase la nota 145, sobre Freud y la compulsión de repetición como figura del fallo de integración.\n\n'
              '<a id="fn-main-150"></a><sup>150</sup> Véase la nota 134, sobre Sartre; aquí la mala fe se aplica específicamente al problema de la segunda mediación y de la apropiación del acto como propio.\n\n'
              '<a id="fn-main-153"></a><sup>153</sup> Véase la nota 131, sobre Kant y la máxima como orientación de la voluntad anterior al resultado.\n\n'
          )
          marker='<a id="fn-main-154"></a><sup>154</sup>'
          if marker not in t: raise SystemExit('No se encontró la nota 154 para insertar reconstrucciones.')
          t=t.replace(marker,rebuilt+marker,1)

          # Nota editorial única de continuidad doctrinal, sin alterar la numeración del libro.
          call='La fórmula es la siguiente: voluntad más primera mediación más acto más segunda mediación produce ego.'
          if call not in t: raise SystemExit('No se encontró la fórmula inicial.')
          t=t.replace(call,call+'<sup id="fnref-ed-cap6"><a href="#fn-ed-cap6">†</a></sup>',1)
          ednote=(
              '<a id="fn-ed-cap6"></a><sup>†</sup> **Nota editorial.** El mapa maestro registra una tensión real de continuidad respecto del orden y la función de las dos mediaciones. En *Caos*, la arquitectura de este capítulo es voluntad → primera mediación (φ₁) → acto → segunda mediación (φ₂) → ego/integral, y la responsabilidad se origina en φ₁. Obras posteriores desplazan o amplían la función de φ₂ y, en algunos casos, redistribuyen el fundamento de responsabilidad. Como el corpus no adjudica una equivalencia definitiva entre esos usos, esta edición conserva íntegramente la arquitectura interna de *Caos*.'
          )
          marker130='<a id="fn-main-130"></a><sup>130</sup>'
          if marker130 not in t: raise SystemExit('No se encontró la nota 130.')
          t=t.replace(marker130,ednote+'\n\n'+marker130,1)

          # No usar guion medio; limpieza de espacios.
          t=t.replace('–','-')
          t=re.sub(r'[ \t]+\n','\n',t)
          t=re.sub(r'\n{4,}','\n\n\n',t).rstrip()+'\n'
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(t,encoding='utf-8')

          refs=[int(x) for x in re.findall(r'href="#fn-main-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>',t)]
          print('MISSING_REFERENCED_NOTES',sorted(set(refs)-set(notes)))
          print('ORPHAN_NOTES',sorted(set(notes)-set(refs)))
          print('EXPECTED_MISSING_130_155',[n for n in range(130,156) if n not in notes])
          print('EM_DASHES',t.count('—'),'EN_DASHES',t.count('–'),'REPL',t.count('�'),'BOX',t.count('□'))
          print('SUSPICIOUS_COMPOUNDS',sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b',t))))
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line:
                  print(f'DASH_LINE {i}: {line[:1800]}')
          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)):
              raise SystemExit('La auditoría de notas falló.')
          if [n for n in range(130,156) if n not in notes]:
              raise SystemExit('La secuencia 130-155 sigue incompleta.')
          if '–' in t or '�' in t or '□' in t:
              raise SystemExit('Persisten caracteres prohibidos o corruptos.')
      - name: Guardar normalización y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalizar-caos-cap6.yml
          git add 'corpus/normalización/caos/capitulo-06.md'
          git commit -m '[MANT][NORMALIZACION] Normalizar capítulo 6 de Caos'
          git push
