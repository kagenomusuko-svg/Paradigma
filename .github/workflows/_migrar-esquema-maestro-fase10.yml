name: Migrar esquema maestro Fase 10

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - ".github/workflows/_migrar-esquema-maestro-fase10.yml"

permissions:
  contents: write

jobs:
  migrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Crear contrato 1.4.1 y alinear productores
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          old_schema = Path('analista/esquema/expediente-maestro-fase10-v1.4.0.schema.json')
          new_schema = Path('analista/esquema/expediente-maestro-fase10-v1.4.1.schema.json')
          old_hash = hashlib.sha256(old_schema.read_bytes()).hexdigest()
          assert old_hash == 'ba4e7c99ec7f3c176a378139ec4538cb20cc6302', old_hash
          assert not new_schema.exists(), new_schema
          new_schema.write_bytes(old_schema.read_bytes())

          def rep(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: esperado {expected} x {old!r}; encontrado {found}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          rep(new_schema, 'expediente-maestro-fase10-v1.4.0.schema.json', 'expediente-maestro-fase10-v1.4.1.schema.json')
          rep(new_schema, 'Expediente maestro independiente de Fase 10 v1.4.0', 'Expediente maestro independiente de Fase 10 v1.4.1')
          rep(new_schema, '"schema_version": {\n      "const": "1.4.0"\n    }', '"schema_version": {\n      "const": "1.4.1"\n    }')
          rep(
              new_schema,
              '"motor": {\n          "const": "ensamblador_maestro_obra_fase10"\n        },\n        "version": {\n          "const": "1.2.0"\n        }',
              '"motor": {\n          "const": "ensamblador_maestro_obra_fase10"\n        },\n        "version": {\n          "const": "1.2.2"\n        }',
          )

          rep(
              'analista/motores/ensamblador_maestro_obra_fase10.py',
              'SCHEMA_VERSION="1.4.0"; MOTOR_VERSION="1.2.1"; CONTROL_VERSION="1.2.0"',
              'SCHEMA_VERSION="1.4.1"; MOTOR_VERSION="1.2.2"; CONTROL_VERSION="1.2.0"',
          )
          rep('analista/motores/ensamblador_maestro_obra_fase10.py', 'expediente-maestro-fase10/1.4.0', 'expediente-maestro-fase10/1.4.1')
          rep('analista/motores/ensamblador_maestro_obra_fase10.py', 'ensamblador_maestro_obra_fase10/1.2.1', 'ensamblador_maestro_obra_fase10/1.2.2')

          rep(
              'analista/pruebas/validar_obra_fase10.py',
              'MASTER_SCHEMA=ROOT/"analista/esquema/expediente-maestro-fase10-v1.4.0.schema.json"',
              'MASTER_SCHEMA=ROOT/"analista/esquema/expediente-maestro-fase10-v1.4.1.schema.json"',
          )
          rep(
              'analista/pruebas/validar_obra_fase10.py',
              'assert m["schema_version"]=="1.4.0" and m["producido_por"]=={"motor":"ensamblador_maestro_obra_fase10","version":"1.2.1"}',
              'assert m["schema_version"]=="1.4.1" and m["producido_por"]=={"motor":"ensamblador_maestro_obra_fase10","version":"1.2.2"}',
          )

          rep('analista/pruebas/validar_cierre_fase10.py', 'PILOT="AA-SP-V1"; VERSION="1.2.0"; PRIORIDAD_DIAGNOSTICA=', 'PILOT="AA-SP-V1"; VERSION="1.2.1"; PRIORIDAD_DIAGNOSTICA=')
          rep(
              'analista/pruebas/validar_cierre_fase10.py',
              'assert master["schema_version"]=="1.4.0" and master["producido_por"]=={"motor":"ensamblador_maestro_obra_fase10","version":"1.2.1"}',
              'assert master["schema_version"]=="1.4.1" and master["producido_por"]=={"motor":"ensamblador_maestro_obra_fase10","version":"1.2.2"}',
          )

          rep(".github/workflows/analista-fase10-cierre-global.yml", "assert m.MOTOR_VERSION=='1.2.1'", "assert m.MOTOR_VERSION=='1.2.2'")
          rep(".github/workflows/analista-fase10-cierre-global.yml", "print('OK Fase 10 ensamblador 1.2.1: matriz cerrada de extractores vigente')", "print('OK Fase 10 ensamblador 1.2.2: matriz cerrada de extractores vigente')")

          assert hashlib.sha256(old_schema.read_bytes()).hexdigest() == old_hash
          ns = new_schema.read_text(encoding='utf-8')
          assert 'expediente-maestro-fase10-v1.4.1.schema.json' in ns
          assert '"const": "1.4.1"' in ns
          assert '"const": "1.2.2"' in ns
          assert 'ensamblador_maestro_obra_fase10/1.2.2' in Path('analista/motores/ensamblador_maestro_obra_fase10.py').read_text(encoding='utf-8')
          PY
      - name: Retirar migrador y persistir transición
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          rm .github/workflows/_migrar-esquema-maestro-fase10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Versionar contrato maestro de Fase 10"
          git push origin HEAD:"${TARGET_BRANCH}"
