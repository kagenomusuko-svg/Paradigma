name: Analista Fase 12 - auditor del corpus

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/README.md"
      - "analista/FASES.md"
      - "analista/config/clausura-descriptiva.yaml"
      - "analista/generado/fase11/almacenamiento-fase11.json"
      - "analista/esquema/auditoria-corpus-fase12-v1.0.0.schema.json"
      - "analista/esquema/expediente-transversal-fase12-v1.0.0.schema.json"
      - "analista/motores/auditor_corpus_fase12.py"
      - "analista/pruebas/validar_auditor_corpus_fase12.py"
      - "analista/pruebas/validar_cierre_fase12.py"
      - ".github/workflows/analista-fase12-cierre.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analista-fase12-cierre-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cierre-fase12:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema

      - name: Validar regresiones epistemológicas del auditor del corpus
        run: python analista/pruebas/validar_auditor_corpus_fase12.py

      - name: Restaurar exclusivamente los productos cerrados de Fase 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json,shlex
          from pathlib import Path
          p=Path('analista/generado/fase11/almacenamiento-fase11.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          gate=data.get('gate',{})
          if data.get('fase') != 11 or gate.get('fase11_cerrada') is not True:
              raise SystemExit('Fase 12 requiere Fase 11 cerrada')
          storage=data['almacenamiento']
          for key,value in (
              ('F11_RELEASE_TAG',storage['release_tag']),
              ('F11_ASSET',storage['asset']),
              ('F11_ASSET_SHA256',storage['asset_sha256']),
          ):
              print(f'export {key}={shlex.quote(value)}')
          PY
          )"
          gh release download "${F11_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${F11_ASSET}" \
            --output fase11.zip
          test "$(sha256sum fase11.zip | awk '{print $1}')" = "${F11_ASSET_SHA256}"
          unzip -qo fase11.zip 'fase11/*' -d analista/generado
          test -f analista/generado/fase11/cierre-fase11.json

      - name: Auditar los nueve productos comparativos y producir expedientes transversales
        run: |
          python analista/motores/auditor_corpus_fase12.py \
            --fase11-dir analista/generado/fase11 \
            --almacenamiento analista/generado/fase11/almacenamiento-fase11.json \
            --salida-dir analista/generado/fase12

      - name: Validar cobertura, clausura y reproducibilidad de Fase 12
        run: |
          python analista/pruebas/validar_cierre_fase12.py \
            --fase11-dir analista/generado/fase11 \
            --almacenamiento-fase11 analista/generado/fase11/almacenamiento-fase11.json \
            --salida-dir analista/generado/fase12 \
            --cierre analista/generado/fase12/cierre-fase12.json

      - name: Empaquetar productos determinísticamente
        run: |
          python - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          root=Path('analista/generado')
          out=Path('analista-fase12-cierre-v1.0.0.zip')
          files=sorted(p for p in (root/'fase12').iterdir() if p.is_file())
          with ZipFile(out,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  info=ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0))
                  info.compress_type=ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xffff)<<16
                  with p.open('rb') as src,z.open(info,'w',force_zip64=True) as dst:
                      shutil.copyfileobj(src,dst,1024*1024)
          h=hashlib.sha256()
          with out.open('rb') as f:
              for chunk in iter(lambda: f.read(1024*1024),b''):
                  h.update(chunk)
          print(f'F12_ZIP_SHA256={h.hexdigest()}')
          print(f'F12_ZIP_BYTES={out.stat().st_size}')
          print(f'F12_ARCHIVOS={len(files)}')
          PY

      - name: Publicar evidencia durable de Fase 12
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: analista-fase12-cierre-v1.0.0
          ASSET: analista-fase12-cierre-v1.0.0.zip
        run: |
          set -euo pipefail
          digest="$(sha256sum "${ASSET}" | awk '{print $1}')"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .target_commitish)"
            test "${target}" = "${GITHUB_SHA}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Analista documental — cierre Fase 12 v1.0.0" \
              --notes "Auditoría descriptiva interobra de los nueve productos cerrados de Fase 11. Los expedientes transversales usan claves documentales de recuperación y no establecen identidad, equivalencia, evolución, contradicción ni definición preferida."
          fi
          gh release upload "${RELEASE_TAG}" "${ASSET}" --clobber --repo "${GITHUB_REPOSITORY}"
          remote_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".assets[] | select(.name==\"${ASSET}\") | .digest")"
          test "${remote_digest}" = "sha256:${digest}"
          echo "Release Fase 12 persistido: ${remote_digest}"

      - name: Persistir gate y manifiesto ligero en Git
        env:
          RELEASE_TAG: analista-fase12-cierre-v1.0.0
          ASSET: analista-fase12-cierre-v1.0.0.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'analista/motores')
          from auditor_corpus_fase12 import sha256_file, write_json
          root=Path('analista/generado/fase12')
          asset=Path(os.environ['ASSET'])
          closure_bytes=(root/'cierre-fase12.json').read_bytes()
          closure=json.loads(closure_bytes)
          audit=json.loads((root/'auditoria-corpus.json').read_text(encoding='utf-8'))
          storage={
              'version':'1.0.0',
              'fase':12,
              'estado':'evidencia_validada_persistida_fuera_de_blobs_git',
              'gate':{
                  'fase12_cerrada':True,
                  'head_sha':os.environ['GITHUB_SHA'],
                  'maestros_origen':20,
                  'motores_auditados':9,
                  'expedientes_transversales':closure['expedientes_transversales'],
                  'cierre_sha256':hashlib.sha256(closure_bytes).hexdigest(),
              },
              'origen_fase11':closure['origen_fase11'],
              'almacenamiento':{
                  'tipo':'github_release_asset_zip',
                  'release_tag':os.environ['RELEASE_TAG'],
                  'asset':os.environ['ASSET'],
                  'asset_sha256':sha256_file(asset),
                  'asset_bytes':asset.stat().st_size,
                  'raiz_al_extraer':'analista/generado',
                  'raiz_contenida':'fase12',
              },
              'productos':[
                  {'tipo':'auditoria_corpus','ruta_en_zip':'fase12/auditoria-corpus.json','sha256':closure['auditoria_sha256']},
                  {'tipo':'expedientes_transversales','ruta_en_zip':'fase12/expedientes-transversales.jsonl','sha256':closure['expedientes_sha256']},
              ],
              'clausura_descriptiva':closure['clausura_descriptiva'],
          }
          if audit['expedientes']['sha256'] != closure['expedientes_sha256']:
              raise SystemExit('Auditoría y cierre F12 divergen antes de persistir')
          write_json(root/'almacenamiento-fase12.json',storage)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/fase12/cierre-fase12.json \
                  analista/generado/fase12/cierre-fase12.json.sha256 \
                  analista/generado/fase12/almacenamiento-fase12.json \
                  analista/generado/fase12/almacenamiento-fase12.json.sha256
          git commit -m "Persistir cierre descriptivo de Fase 12"
          git push origin HEAD:analisis-textual-v0.1
