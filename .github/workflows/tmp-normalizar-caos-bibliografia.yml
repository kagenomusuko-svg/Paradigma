name: Normalizar temporalmente bibliografía de Caos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalizar-caos-bibliografia.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalizar y auditar bibliografía
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata

          src = Path('corpus/libros/caos/98-bibliografia.md')
          dst = Path('corpus/normalización/caos/98-bibliografia.md')
          t = unicodedata.normalize('NFC', src.read_text(encoding='utf-8'))

          # Reparación estructural de la entrada EPR absorbida por el encabezado.
          t = t.replace(
              '## E Einstein, Albert, Boris Podolsky y Nathan Rosen. "Can\n\nQuantum-Mechanical Description of Physical Reality Be Considered Complete?" *Physical Review* 47, núm. 10 (1935): 777-780.',
              '## E\n\n**Einstein, Albert, Boris Podolsky y Nathan Rosen.** «Can Quantum-Mechanical Description of Physical Reality Be Considered Complete?» *Physical Review* 47, núm. 10 (1935): 777-780.'
          )

          # Comillas bibliográficas españolas.
          t = re.sub(r'"([^"\n]+)"', r'«\1»', t)

          # Toponimia y ortotipografía consistente.
          t = t.replace('Paris:', 'París:')
          t = t.replace('*The Complete Works of Aristotle,*', '*The Complete Works of Aristotle*,')
          t = t.replace('*Obras,*', '*Obras*,')
          t = t.replace('*Freedom and Determinism,*', '*Freedom and Determinism*,')
          t = t.replace('*Opuscules et fragments inédits,*', '*Opuscules et fragments inédits*,')
          t = t.replace('*Tractatus Logico- Philosophicus.*', '*Tractatus Logico-Philosophicus.*')

          # La referencia española de Uexküll estaba atribuida a otra obra.
          old_uex = '**Von Uexküll, Jakob.** *Streifzüge durch die Umwelten von Tieren und Menschen.* Berlín: Springer, 1934. [Trad. esp.: *Cartas biológicas a una dama.* Madrid: Revista de Occidente, 1934.]'
          new_uex = '**Von Uexküll, Jakob y Georg Kriszat.** *Streifzüge durch die Umwelten von Tieren und Menschen.* Berlín: Springer, 1934. [Trad. esp.: *Andanzas por los mundos circundantes de los animales y los hombres.* Buenos Aires: Cactus, 2016.]'
          if old_uex not in t:
              raise SystemExit('No se encontró la entrada original de von Uexküll.')
          t = t.replace(old_uex, new_uex, 1)

          # Limpieza de espacios sin alterar datos bibliográficos.
          t = re.sub(r'[ \t]+\n', '\n', t)
          t = re.sub(r'\n{3,}', '\n\n', t)

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(t.rstrip() + '\n', encoding='utf-8')

          # Auditoría estructural.
          lines = t.splitlines()
          entries = [ln for ln in lines if ln.startswith('**')]
          bad_visible_quotes = [(i+1, ln) for i, ln in enumerate(lines) if '"' in ln]
          bad_chars = {c: t.count(c) for c in ['—','–','□','�']}
          bad_headings = [(i+1, ln) for i, ln in enumerate(lines) if ln.startswith('##') and not re.fullmatch(r'## [A-Z]', ln)]
          continuations = []
          for i, ln in enumerate(lines):
              if not ln.strip() or ln.startswith('#') or ln.startswith('*Se incluyen') or ln.startswith('**'):
                  continue
              continuations.append((i+1, ln))
          dupes = sorted({e for e in entries if entries.count(e) > 1})
          print('ENTRADAS', len(entries))
          print('BAD_HEADINGS', bad_headings)
          print('CONTINUACIONES_NO_ESPERADAS', continuations)
          print('COMILLAS_RECTAS', bad_visible_quotes)
          print('CARACTERES_PROHIBIDOS', bad_chars)
          print('DUPLICADOS_EXACTOS', dupes)

          if bad_headings or continuations or bad_visible_quotes or any(bad_chars.values()) or dupes:
              raise SystemExit('La auditoría estructural de la bibliografía falló.')

          # Auditoría indicativa de autores citados en notas que podrían faltar en bibliografía.
          bib = t.lower()
          candidates = {}
          note_files = sorted(Path('corpus/normalización/caos').glob('*.md'))
          author_rx = re.compile(r'\b([A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñßøØ-]{2,}),\s+([A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ. -]{1,40})(?=[.,;(])')
          ignore = {'Nota','Madrid','Barcelona','México','Buenos','Nueva','Oxford','Cambridge','Londres','París','Berlín','Princeton','Halle','Leipzig','Praga','Ámsterdam','Salamanca','Ithaca','Tübingen'}
          for p in note_files:
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '<a id="fn-' not in line:
                      continue
                  for m in author_rx.finditer(line):
                      surname = m.group(1)
                      if surname in ignore:
                          continue
                      if surname.lower() not in bib:
                          candidates.setdefault(surname, []).append((p.name, line[:500]))
          print('CANDIDATOS_AUTORES_SIN_ENTRADA', sorted(candidates))
          for surname, contexts in sorted(candidates.items()):
              print('MISSING_CANDIDATE', surname)
              for fn, ctx in contexts[:3]:
                  print(' ', fn, ctx)

      - name: Guardar primera pasada y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalizar-caos-bibliografia.yml
          git add 'corpus/normalización/caos/98-bibliografia.md'
          git commit -m '[MANT][NORMALIZACION] Normalizar bibliografía de Caos'
          git push
