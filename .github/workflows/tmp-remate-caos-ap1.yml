name: Rematar Caos apéndice 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-remate-caos-ap1.yml'

permissions:
  contents: write

jobs:
  remate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir residuos de maquetación y validar
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('corpus/normalización/caos/apendice-01.md')
          t=p.read_text(encoding='utf-8')

          t=t.replace(
              'Decimos que el **límite de** *f***(**x**) cuando** x **tiende a** x₀ **es** L, y escribimos:',
              'Decimos que el límite de f(x) cuando x tiende a x₀ es L, y escribimos:'
          )

          # Reparar cortes de maquetación residuales sin alterar contenido.
          t=re.sub(
              r'Para una partición P = \{a = x₀ < x₁ < … < xₙ\s*= b\} y puntos de muestra cᵢ ∈ \[xᵢ₋₁, xᵢ\], la suma\s+de Riemann es:',
              'Para una partición P = {a = x₀ < x₁ < … < xₙ = b} y puntos de muestra cᵢ ∈ [xᵢ₋₁, xᵢ], la suma de Riemann es:',
              t
          )
          t=t.replace(
              'Sea A un subconjunto de ℝ. Un punto p ∈ ℝ\n\nes un punto de acumulación',
              'Sea A un subconjunto de ℝ. Un punto p ∈ ℝ es un punto de acumulación'
          )
          t=t.replace(
              'Continuamos produciendo una cadena de intervalos\n\nanidados I₁ ⊇ I₂ ⊇ I₃ ⊇... cuyas longitudes tienden a cero.',
              'Continuamos produciendo una cadena de intervalos anidados I₁ ⊇ I₂ ⊇ I₃ ⊇ ... cuyas longitudes tienden a cero.'
          )
          t=t.replace(
              'Comienza con el intervalo [0, 1]. En el primer paso,\n\nretira el tercio central abierto (1/3, 2/3): quedan [0, 1/3] ∪\n\n[2/3, 1].',
              'Comienza con el intervalo [0, 1]. En el primer paso, retira el tercio central abierto (1/3, 2/3): quedan [0, 1/3] ∪ [2/3, 1].'
          )

          # Espaciado de elipsis en enumeraciones matemáticas/prosa.
          t=t.replace(',...', ', ...').replace('⊇...', '⊇ ...').replace('+...', '+ ...')

          # Convertir comillas rectas textuales sin tocar atributos HTML.
          def spanish_quotes(line):
              parts=re.split(r'(<[^>]+>)',line)
              for i,part in enumerate(parts):
                  if part.startswith('<') and part.endswith('>'):
                      continue
                  parts[i]=re.sub(r'"([^"\n]+)"',r'«\1»',part)
              return ''.join(parts)
          t='\n'.join(spanish_quotes(line) for line in t.split('\n'))

          t=re.sub(r'[ \t]+\n','\n',t)
          t=re.sub(r'[ \t]{2,}',' ',t)

          refs=[int(x) for x in re.findall(r'href="#fn-app-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-app-(\d+)"></a>',t)]
          edrefs=set(re.findall(r'href="#(fn-ed-ap1-[^"]+)"',t))
          ednotes=set(re.findall(r'<a id="(fn-ed-ap1-[^"]+)"></a>',t))
          bad_patterns=[
              '**límite de**', '*f***', ',...', '⊇...', '□', '�', '–', '—',
              'x₀ ₀ ₀', 'f□', 'x□'
          ]
          bad=[x for x in bad_patterns if x in t]
          print('BAD_PATTERNS',bad)
          print('MISSING_APP',sorted(set(refs)-set(notes)),'ORPHAN_APP',sorted(set(notes)-set(refs)))
          print('MISSING_1_12',[n for n in range(1,13) if n not in notes])
          print('MISSING_ED',sorted(edrefs-ednotes),'ORPHAN_ED',sorted(ednotes-edrefs))
          if bad:
              raise SystemExit('Persisten residuos tipográficos o caracteres prohibidos.')
          if set(refs)!=set(notes) or [n for n in range(1,13) if n not in notes] or edrefs!=ednotes:
              raise SystemExit('Auditoría de notas falló.')
          p.write_text(t.rstrip()+'\n',encoding='utf-8')
      - name: Guardar remate y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-remate-caos-ap1.yml
          git add 'corpus/normalización/caos/apendice-01.md'
          git commit -m '[MANT][NORMALIZACION] Rematar Caos apéndice 1'
          git push
