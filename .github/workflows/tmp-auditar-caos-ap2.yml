name: Auditar temporalmente Caos apéndice 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auditar-caos-ap2.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auditar apéndice y mapa
        shell: python
        run: |
          from pathlib import Path
          import json,re
          t=Path('corpus/libros/caos/apendice-02.md').read_text(encoding='utf-8')
          refs=[int(x) for x in re.findall(r'href="#fn-app-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-app-(\d+)"></a>',t)]
          plain=[int(x) for x in re.findall(r'<sup>(\d+)</sup>',t)]
          print('CHARS',len(t),'LINES',len(t.splitlines()))
          print('REFS',sorted(set(refs)))
          print('NOTES',notes)
          print('PLAIN',plain)
          print('MISSING_REFS',sorted(set(refs)-set(notes)))
          print('ORPHANS',sorted(set(notes)-set(refs)-set(plain)))
          if refs or notes:
              lo=min(refs+notes); hi=max(refs+notes)
              print('RANGE',lo,hi,'MISSING',[n for n in range(lo,hi+1) if n not in notes])
          print('EM_DASHES',t.count('—'),'EN_DASHES',t.count('–'),'BOXES',t.count('□'),'REPL',t.count('�'))
          print('SUSPICIOUS',sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b',t))))
          for i,line in enumerate(t.splitlines(),1):
              if '□' in line or '�' in line:
                  print(f'CORRUPT {i}: {line}')
          mapa=json.loads(Path('mapa/mapa-maestro.json').read_text(encoding='utf-8'))
          keys=('quantum','cuánt','isomorf','medición','measurement','bohm','many','copenh','decoher','colapso físico')
          for i,item in enumerate(mapa.get('review_queue', [])):
              dump=json.dumps(item,ensure_ascii=False).lower()
              if 'ev.caos' in dump and any(k in dump for k in keys):
                  print('MAP_REVIEW',i,json.dumps(item,ensure_ascii=False))
      - name: Retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-auditar-caos-ap2.yml
          git commit -m '[MANT][NORMALIZACION] Retirar auditoría temporal de Caos apéndice 2'
          git push
