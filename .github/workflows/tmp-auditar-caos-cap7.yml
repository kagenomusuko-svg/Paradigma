name: Auditar temporalmente Caos capítulo 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auditar-caos-cap7.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auditar capítulo y mapa
        shell: python
        run: |
          from pathlib import Path
          import json, re, subprocess
          p=Path('corpus/libros/caos/capitulo-07.md')
          t=p.read_text(encoding='utf-8')
          refs=[int(x) for x in re.findall(r'href="#fn-main-(\d+)"',t)]
          plain=[int(x) for x in re.findall(r'<sup>(\d+)</sup>',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>',t)]
          print('CHARS',len(t),'LINES',len(t.splitlines()))
          print('LINKED_REFS',sorted(set(refs)))
          print('PLAIN_SUP_REFS',plain)
          print('NOTES',notes)
          print('MISSING_LINKED',sorted(set(refs)-set(notes)))
          print('PLAIN_WITHOUT_NOTE',sorted(set(plain)-set(notes)))
          print('ORPHAN_NOTES',sorted(set(notes)-set(refs)-set(plain)))
          lo=min(notes+refs+plain); hi=max(notes+refs+plain)
          print('EXPECTED_RANGE',lo,hi,'MISSING',[n for n in range(lo,hi+1) if n not in notes])
          print('EM_DASHES',t.count('—'),'EN_DASHES',t.count('–'),'REPL',t.count('�'),'BOX',t.count('□'))
          print('SUSPICIOUS_COMPOUNDS',sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b',t))))
          for n in sorted(set(plain)-set(notes)):
              cp=subprocess.run(['git','grep','-n',f'fn-main-{n}','--','corpus'],capture_output=True,text=True)
              print('GREP',n,cp.stdout.strip() or '<none>')
          mapa=json.loads(Path('mapa/mapa-maestro.json').read_text(encoding='utf-8'))
          keys=('causal','responsab','condición sine','ego','integral','muerte','identidad','colapso','hume','kant')
          for i,item in enumerate(mapa.get('review_queue', [])):
              dump=json.dumps(item,ensure_ascii=False).lower()
              if 'ev.caos' in dump and any(k in dump for k in keys):
                  print('MAP_REVIEW',i,json.dumps(item,ensure_ascii=False))
      - name: Retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-auditar-caos-cap7.yml
          git commit -m '[MANT][NORMALIZACION] Retirar auditoría temporal de Caos capítulo 7'
          git push
