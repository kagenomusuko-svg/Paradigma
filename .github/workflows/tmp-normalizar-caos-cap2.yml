name: Normalizar temporalmente Caos capítulo 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalizar-caos-cap2.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalizar capítulo y auditar mapa
        shell: python
        run: |
          from pathlib import Path
          import json, re, unicodedata

          src = Path('corpus/libros/caos/capitulo-02.md')
          dst = Path('corpus/normalización/caos/capitulo-02.md')
          original = src.read_text(encoding='utf-8')
          text = unicodedata.normalize('NFC', original)

          # Reconstrucción ortotipográfica del subtítulo y epígrafe.
          text = text.replace(
              '*Cuando el infinito se determina «El límite es la forma que el infinito toma cuando se decide a ser algo.»* — Miguel Hilario Olvera Aguilar',
              '*Cuando el infinito se determina*\n\n«El límite es la forma que el infinito toma cuando se decide a ser algo.» —Miguel Hilario Olvera Aguilar'
          )

          # Correcciones inequívocas de forma y caracteres dañados.
          text = text.replace('contra-intuitivo', 'contraintuitivo')
          text = text.replace('contra-intuitivas', 'contraintuitivas')
          text = text.replace('Zeno de Elea', 'Zenón de Elea')
          text = text.replace(
              'i□ ∂ψ/∂t = Ĥψ, donde ψ es la función de onda, □ es la constante de Planck reducida',
              'iℏ ∂ψ/∂t = Ĥψ, donde ψ es la función de onda, ℏ es la constante de Planck reducida'
          )
          text = text.replace('10⁻ ²□', '10⁻²⁰')

          # La llamada 38 está huérfana; el párrafo cita el mismo principio desarrollado en la nota 37.
          text = text.replace(
              'Werner Heisenberg formuló esto como principio en 1927: es imposible conocer simultáneamente con precisión arbitraria la posición y el momento de una partícula.<sup>38</sup>',
              'Werner Heisenberg formuló esto como principio en 1927: es imposible conocer simultáneamente con precisión arbitraria la posición y el momento de una partícula.<sup id="fnref-main-37b"><a href="#fn-main-37">37</a></sup>'
          )

          # Reducir incisos cerrados con raya a paréntesis.
          inciso = re.compile(r'\s—\s*([^—\n]{1,300}?)\s*—(?=[,.;:?!)]|\s)')
          while inciso.search(text):
              text = inciso.sub(lambda m: ' (' + m.group(1).strip() + ')', text)

          # Limpiar espaciado de rayas restantes.
          text = re.sub(r'—\s+', '—', text)
          text = re.sub(r'\s+—', ' —', text)

          # Comillas angulares en prosa, sin tocar atributos HTML.
          def quotes_line(line: str) -> str:
              out = []
              in_tag = False
              opening = True
              for ch in line:
                  if ch == '<':
                      in_tag = True
                  if ch == '"' and not in_tag:
                      out.append('«' if opening else '»')
                      opening = not opening
                  else:
                      out.append(ch)
                  if ch == '>':
                      in_tag = False
              return ''.join(out)
          text = '\n'.join(quotes_line(line) for line in text.split('\n'))

          # Las notas ya llevan número en <sup>; retirar numeración plana duplicada/desfasada.
          text = re.sub(r'(<a id="fn-main-(\d+)"></a><sup>\2</sup>)\s+\d+\s+', r'\1 ', text)

          # Limpieza de blancos y normalización Unicode.
          text = text.replace('–', '-')
          text = re.sub(r'[ \t]+\n', '\n', text)
          text = re.sub(r'\n{4,}', '\n\n\n', text).rstrip() + '\n'

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text, encoding='utf-8')

          # Auditoría estructural de notas.
          refs = [int(x) for x in re.findall(r'href="#fn-main-(\d+)"', text)]
          notes = [int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>', text)]
          print('SOURCE_CHARS:', len(original))
          print('NORMALIZED_CHARS:', len(text))
          print('REFS_UNIQUE:', sorted(set(refs)))
          print('NOTES:', notes)
          print('MISSING_REFERENCED_NOTES:', sorted(set(refs) - set(notes)))
          print('ORPHAN_NOTES:', sorted(set(notes) - set(refs)))
          print('REMAINING_BOX_GLYPHS:', text.count('□'))
          print('REMAINING_REPLACEMENT_GLYPHS:', text.count('�'))
          print('REMAINING_EM_DASHES:', text.count('—'))
          for i, line in enumerate(text.splitlines(), 1):
              if '—' in line:
                  print(f'DASH_LINE {i}: {line[:1400]}')

          # Auditoría focalizada del mapa maestro.
          mapa = json.loads(Path('mapa/mapa-maestro.json').read_text(encoding='utf-8'))
          wanted = {
              'review.caos.formal_typing',
              'review.caos.accumulation_topology',
              'review.caos.local_derivative',
              'review.axiom.closure',
              'review.axiom.perfect',
          }
          found = []
          def walk(x, path='$'):
              if isinstance(x, dict):
                  if x.get('id') in wanted:
                      found.append((path, x))
                  for k, v in x.items():
                      walk(v, f'{path}.{k}')
              elif isinstance(x, list):
                  for i, v in enumerate(x):
                      walk(v, f'{path}[{i}]')
          walk(mapa)
          print('MAP_REVIEW_ITEMS:', len(found))
          for path, item in found:
              print('MAP_REVIEW', path, json.dumps(item, ensure_ascii=False))

      - name: Guardar edición y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalizar-caos-cap2.yml
          git add 'corpus/normalización/caos/capitulo-02.md'
          git commit -m '[MANT][NORMALIZACION] Normalizar capítulo 2 de Caos'
          git push
