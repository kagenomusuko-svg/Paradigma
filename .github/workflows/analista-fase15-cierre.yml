name: Analista Fase 15 - interfaz para sistemas de IA

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/README.md"
      - "analista/FASES.md"
      - "analista/config/clausura-descriptiva.yaml"
      - "analista/generado/fase13/almacenamiento-fase13.json"
      - "analista/generado/fase14/almacenamiento-fase14.json"
      - "analista/esquema/paquete-interfaz-ia-fase15-v1.0.0.schema.json"
      - "analista/motores/consulta_literal_fase14.py"
      - "analista/motores/interfaz_ia_fase15.py"
      - "analista/pruebas/validar_interfaz_ia_fase15.py"
      - "analista/pruebas/validar_cierre_fase15.py"
      - ".github/workflows/analista-fase15-cierre.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analista-fase15-cierre-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cierre-fase15:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema

      - name: Validar regresiones epistemológicas de la interfaz para IA
        run: python analista/pruebas/validar_interfaz_ia_fase15.py

      - name: Restaurar el maestro cerrado de Fase 13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json,shlex
          from pathlib import Path
          data=json.loads(Path('analista/generado/fase13/almacenamiento-fase13.json').read_text(encoding='utf-8'))
          if data.get('fase') != 13 or data.get('gate',{}).get('fase13_cerrada') is not True:
              raise SystemExit('Fase 15 requiere Fase 13 cerrada')
          s=data['almacenamiento']
          for k,v in [('TAG13',s['release_tag']),('ASSET13',s['asset']),('SHA13',s['asset_sha256'])]:
              print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          gh release download "${TAG13}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET13}" --output fase13.zip
          test "$(sha256sum fase13.zip | awk '{print $1}')" = "${SHA13}"
          mkdir -p analista/generado
          unzip -qo fase13.zip 'fase13/*' -d analista/generado
          test -f analista/generado/fase13/maestro-corpus.json
          test -f analista/generado/fase13/conceptos-maestro-corpus.jsonl
          test -f analista/generado/fase13/formulas-corpus.jsonl
          test -f analista/generado/fase13/cierre-fase13.json
          rm -f fase13.zip

      - name: Restaurar las respuestas cerradas de Fase 14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json,shlex
          from pathlib import Path
          data=json.loads(Path('analista/generado/fase14/almacenamiento-fase14.json').read_text(encoding='utf-8'))
          if data.get('fase') != 14 or data.get('gate',{}).get('fase14_cerrada') is not True:
              raise SystemExit('Fase 15 requiere Fase 14 cerrada')
          s=data['almacenamiento']
          for k,v in [('TAG14',s['release_tag']),('ASSET14',s['asset']),('SHA14',s['asset_sha256'])]:
              print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          gh release download "${TAG14}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET14}" --output fase14.zip
          test "$(sha256sum fase14.zip | awk '{print $1}')" = "${SHA14}"
          unzip -qo fase14.zip 'fase14/*' -d analista/generado
          test -f analista/generado/fase14/cierre-fase14.json
          test -f analista/generado/fase14/muestra-respuestas-fase14.jsonl
          test -f analista/generado/fase14/auditoria-consulta-fase14.json
          rm -f fase14.zip

      - name: Ejecutar y validar paquetes para IA sobre productos reales
        run: |
          python analista/pruebas/validar_cierre_fase15.py \
            --fase13-dir analista/generado/fase13 \
            --almacenamiento-fase13 analista/generado/fase13/almacenamiento-fase13.json \
            --fase14-dir analista/generado/fase14 \
            --almacenamiento-fase14 analista/generado/fase14/almacenamiento-fase14.json \
            --salida-dir analista/generado/fase15 \
            --cierre analista/generado/fase15/cierre-fase15.json

      - name: Empaquetar productos determinísticamente
        run: |
          python - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          root=Path('analista/generado')
          out=Path('analista-fase15-cierre-v1.0.0.zip')
          files=sorted(p for p in (root/'fase15').iterdir() if p.is_file())
          with ZipFile(out,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  info=ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0))
                  info.compress_type=ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xffff)<<16
                  with p.open('rb') as src,z.open(info,'w',force_zip64=True) as dst:
                      shutil.copyfileobj(src,dst,1024*1024)
          h=hashlib.sha256()
          with out.open('rb') as f:
              for chunk in iter(lambda: f.read(1024*1024),b''):
                  h.update(chunk)
          print(f'F15_ZIP_SHA256={h.hexdigest()}')
          print(f'F15_ZIP_BYTES={out.stat().st_size}')
          print(f'F15_ARCHIVOS={len(files)}')
          PY

      - name: Publicar evidencia durable de Fase 15
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: analista-fase15-cierre-v1.0.0
          ASSET: analista-fase15-cierre-v1.0.0.zip
        run: |
          set -euo pipefail
          digest="$(sha256sum "${ASSET}" | awk '{print $1}')"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .target_commitish)"
            test "${target}" = "${GITHUB_SHA}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Analista documental — cierre Fase 15 v1.0.0" \
              --notes "Interfaz documental para IA construida sobre F14 cerrado y F13 auditado. Expone registros utilizados, texto literal, IDs, estatus, hallazgos, referencias y restricciones de respuesta. Sólo genera presentación extractiva con referencias o abstención; no completa lagunas, reconcilia formulaciones ni presenta inferencias como corpus."
          fi
          gh release upload "${RELEASE_TAG}" "${ASSET}" --clobber --repo "${GITHUB_REPOSITORY}"
          remote_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".assets[] | select(.name==\"${ASSET}\") | .digest")"
          test "${remote_digest}" = "sha256:${digest}"
          echo "Release Fase 15 persistido: ${remote_digest}"

      - name: Persistir gate y manifiesto ligero en Git
        env:
          RELEASE_TAG: analista-fase15-cierre-v1.0.0
          ASSET: analista-fase15-cierre-v1.0.0.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'analista/motores')
          from interfaz_ia_fase15 import sha256_file

          def write_json(path, value):
              path.write_text(json.dumps(value,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
              digest=sha256_file(path)
              path.with_name(path.name+'.sha256').write_text(f'{digest}  {path.name}\n',encoding='utf-8')
              return digest

          root=Path('analista/generado/fase15')
          asset=Path(os.environ['ASSET'])
          closure_bytes=(root/'cierre-fase15.json').read_bytes()
          closure=json.loads(closure_bytes)
          storage={
              'version':'1.0.0',
              'fase':15,
              'estado':'evidencia_validada_persistida_fuera_de_blobs_git',
              'gate':{
                  'fase15_cerrada':True,
                  'head_sha':os.environ['GITHUB_SHA'],
                  'paquetes_generados':closure['paquetes_generados'],
                  'registros_utilizados_expuestos':closure['registros_utilizados_expuestos'],
                  'abstenciones':closure['abstenciones'],
                  'cierre_sha256':hashlib.sha256(closure_bytes).hexdigest(),
              },
              'origen_fase14':closure['origen_fase14'],
              'origen_fase13':closure['origen_fase13'],
              'almacenamiento':{
                  'tipo':'github_release_asset_zip',
                  'release_tag':os.environ['RELEASE_TAG'],
                  'asset':os.environ['ASSET'],
                  'asset_sha256':sha256_file(asset),
                  'asset_bytes':asset.stat().st_size,
                  'raiz_al_extraer':'analista/generado',
                  'raiz_contenida':'fase15',
              },
              'productos':[
                  {'tipo':'auditoria_interfaz_ia','ruta_en_zip':'fase15/auditoria-interfaz-ia-fase15.json','sha256':closure['auditoria_sha256']},
                  {'tipo':'muestra_paquetes_interfaz_ia','ruta_en_zip':'fase15/muestra-paquetes-ia-fase15.jsonl','sha256':closure['paquetes_sha256'],'registros':closure['paquetes_generados']},
              ],
              'clausura_descriptiva':closure['clausura_descriptiva'],
          }
          write_json(root/'almacenamiento-fase15.json',storage)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/fase15/cierre-fase15.json \
                  analista/generado/fase15/cierre-fase15.json.sha256 \
                  analista/generado/fase15/almacenamiento-fase15.json \
                  analista/generado/fase15/almacenamiento-fase15.json.sha256
          git commit -m "Persistir cierre descriptivo de Fase 15"
          git push origin HEAD:analisis-textual-v0.1
