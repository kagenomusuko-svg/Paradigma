name: Segmentar corpus

on:
  push:
    branches: [main]
    paths:
      - 'corpus/fuentes/**'

permissions:
  contents: write

jobs:
  segmentar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Segmentar y verificar corpus inicial
        run: python scripts/segmentar_corpus.py

      - name: Segmentar y verificar segundo lote
        run: python scripts/segmentar_lote_02.py

      - name: Segmentar y verificar tercer lote
        run: python scripts/segmentar_lote_03.py

      - name: Reconstruir catálogo general
        run: python scripts/construir_catalogo.py

      - name: Recalcular integridad de todas las fuentes
        run: python scripts/recalcular_hashes.py

      - name: Guardar resultados
        env:
          ORIGIN_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/libros corpus/catalogo-generado.json corpus/fuentes/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No hay cambios derivados que guardar."
          else
            PHASE=$(printf '%s\n' "$ORIGIN_MESSAGE" | sed -nE 's/^\[(F[0-5]|MANT)\].*/\1/p' | head -n 1)
            if [ -z "$PHASE" ]; then PHASE="MANT"; fi
            git commit \
              -m "[$PHASE][ESTRUCTURA][DERIVADO] Regenerar corpus segmentado" \
              -m "ORIGEN: $ORIGIN_MESSAGE" \
              -m "CAMBIO_DE_HITO: no"
            git push
          fi
