name: Segmentar corpus

on:
  push:
    branches: [main]
    paths:
      - 'corpus/fuentes/**'

permissions:
  contents: write

jobs:
  segmentar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Segmentar y verificar corpus
        run: python scripts/segmentar_corpus.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/libros corpus/catalogo-generado.json corpus/fuentes/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No hay cambios derivados que guardar."
          else
            git commit -m "Regenerar corpus segmentado"
            git push
          fi
