name: Segmentar corpus

on:
  push:
    branches:
      - main
      - mant/segmentacion-corpus-completa
    paths:
      - 'corpus/fuentes/**'
      - 'scripts/segmentar_*.py'
      - 'scripts/construir_catalogo.py'
      - 'scripts/recalcular_hashes.py'
      - 'scripts/validar_cobertura_segmentacion.py'
      - '.github/workflows/segmentar-corpus.yml'

permissions:
  contents: write

jobs:
  segmentar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnóstico temporal de Taxonomía
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('corpus/fuentes/Taxonomía General de Aplicaciones.md')
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              text = line.strip()
              if ('U·' in text and ('Capítulo' in text or 'PARTE U' in text)) or text.startswith('### Capítulo '):
                  print(f'{number}: {text}')
          PY

      - name: Segmentar y verificar corpus completo
        run: python scripts/segmentar_fuentes_actuales.py

      - name: Reconstruir catálogo general
        run: python scripts/construir_catalogo.py

      - name: Recalcular integridad de todas las fuentes
        run: python scripts/recalcular_hashes.py

      - name: Verificar cobertura integral de fuentes
        run: python scripts/validar_cobertura_segmentacion.py

      - name: Guardar resultados
        env:
          ORIGIN_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/libros corpus/catalogo-generado.json corpus/fuentes/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No hay cambios derivados que guardar."
          else
            PHASE=$(printf '%s\n' "$ORIGIN_MESSAGE" | sed -nE 's/^\[(F[0-5]|MANT)\].*/\1/p' | head -n 1)
            if [ -z "$PHASE" ]; then PHASE="MANT"; fi
            git commit \
              -m "[$PHASE][ESTRUCTURA][DERIVADO] Regenerar corpus segmentado" \
              -m "ORIGEN: $ORIGIN_MESSAGE" \
              -m "CAMBIO_DE_HITO: no"
            git push
          fi
