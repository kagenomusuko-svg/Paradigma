name: Pulir temporalmente Caos capítulo 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pulir-caos-cap5.yml'

permissions:
  contents: write

jobs:
  pulir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cerrar ortotipografía y rayas residuales
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('corpus/normalización/caos/capitulo-05.md')
          t = p.read_text(encoding='utf-8')
          replacements = {
              'o asimilándolo al ego humano — proyectando sobre el animal': 'o asimilándolo al ego humano, proyectando sobre el animal',
              'su mediación en sentido propio —lo que emergió de su primera mediación': 'su mediación en sentido propio: lo que emergió de su primera mediación',
              'y meras condiciones de fondo —condiciones que preexistían': 'y meras condiciones de fondo, condiciones que preexistían',
              'y cuál fue el accidente —qué fue lo que ocurrió': 'y cuál fue el accidente, es decir, qué fue lo que ocurrió',
              'despliega en el tiempo —un colapso, una actualización': 'despliega en el tiempo: un colapso, una actualización',
              'La autoconciencia no crea la mediación —las mediaciones neutrales ocurren sin ella.': 'La autoconciencia no crea la mediación; las mediaciones neutrales ocurren sin ella.',
              'no solo produce un efecto —actúa *acerca* de algo': 'no solo produce un efecto; actúa *acerca* de algo',
              'El ego no solo actúa hacia objetos intencionales —también puede actuar hacia sí mismo': 'El ego no solo actúa hacia objetos intencionales; también puede actuar hacia sí mismo',
              'y los actos perlocucionarios —los efectos producidos en el oyente.': 'y los actos perlocucionarios (los efectos producidos en el oyente).',
              'el medio en que las cosas se revelan —y también el medio en que pueden ser ocultadas.': 'el medio en que las cosas se revelan, y también el medio en que pueden ser ocultadas.',
              'hasta su forma más específicamente humana —el lenguaje como determinación y apertura.': 'hasta su forma más específicamente humana: el lenguaje como determinación y apertura.',
              'además tiene causa final — actúa por un propósito': 'además tiene causa final: actúa por un propósito',
              'las transmiten a sus crías — hay tradiciones culturales locales': 'las transmiten a sus crías; hay tradiciones culturales locales',
              'mediante los deseos de segundo orden —de querer que sea efectivo': 'mediante los deseos de segundo orden, es decir, de querer que sea efectivo',
              'ocurre a través del habitus —son mediaciones que tienen': 'ocurre a través del habitus; son mediaciones que tienen',
              'el acto no solo produce un resultado —está orientado hacia un resultado': 'el acto no solo produce un resultado; está orientado hacia un resultado',
              'el control del comportamiento — todos ellos pueden en principio explicarse': 'el control del comportamiento; todos ellos pueden, en principio, explicarse',
              'sin experiencia subjetiva —lo que Chalmers llama': 'sin experiencia subjetiva, lo que Chalmers llama',
              'un existenciario fundamental del Dasein —no una propiedad que el Dasein tiene': 'un existenciario fundamental del Dasein, no una propiedad que el Dasein tiene',
              'Edmund\n\nHusserl desarrolló': 'Edmund Husserl desarrolló',
              'el martillo colapsa en el punto que la física determina dado su masa, su velocidad y el ángulo de impacto.': 'el martillo colapsa en el punto que la física determina según su masa, su velocidad y el ángulo de impacto.',
              'El ego colapsa en el punto que la primera mediación determina dado su orientación hacia un objeto representado y su capacidad de evaluar esa orientación.': 'El ego colapsa en el punto que la primera mediación determina según su orientación hacia un objeto representado y su capacidad de evaluar esa orientación.',
          }
          for a,b in replacements.items():
              if a in t:
                  t = t.replace(a,b)

          dash_lines=[]
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line and not line.startswith('«Un martillo no elige el clavo. Un ego sí elige el martillo.» —Miguel Hilario Olvera Aguilar'):
                  dash_lines.append((i,line))
          print('UNRESOLVED_DASH_LINES', len(dash_lines))
          for i,line in dash_lines:
              print(f'DASH {i}: {line[:1800]}')
          refs=[int(x) for x in re.findall(r'href="#fn-main-(\d+)"', t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>', t)]
          print('MISSING_REFERENCED_NOTES', sorted(set(refs)-set(notes)))
          print('ORPHAN_NOTES', sorted(set(notes)-set(refs)))
          print('EM_DASHES', t.count('—'), 'EN_DASHES', t.count('–'))
          print('EDITORIAL_CALL', t.count('fnref-ed-cap5'), 'EDITORIAL_NOTE', t.count('fn-ed-cap5'))
          print('SUSPICIOUS_COMPOUNDS', sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b', t))))
          if dash_lines:
              raise SystemExit('Quedaron rayas de prosa sin resolver.')
          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)):
              raise SystemExit('La auditoría de notas falló.')
          if '–' in t or '�' in t or '□' in t:
              raise SystemExit('Persisten caracteres prohibidos o corruptos.')
          p.write_text(t, encoding='utf-8')
      - name: Guardar pulido y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pulir-caos-cap5.yml
          git add 'corpus/normalización/caos/capitulo-05.md'
          git commit -m '[MANT][NORMALIZACION] Pulir ortotipografía de Caos capítulo 5'
          git push