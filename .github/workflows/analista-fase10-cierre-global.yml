name: Analista Fase 10 - cierre global

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/README.md"
      - "analista/FASES.md"
      - "analista/config/clausura-descriptiva.yaml"
      - "analista/motores/inventariar_obras_fase10.py"
      - "analista/motores/ejecutar_extractores_obra_fase10.py"
      - "analista/motores/ensamblador_maestro_obra_fase10.py"
      - "analista/motores/conceptos.py"
      - "analista/motores/conceptos_obra_fase10.py"
      - "analista/motores/conceptos_compuesto_fase10.py"
      - "analista/motores/definiciones.py"
      - "analista/motores/definiciones_compuesto_fase10.py"
      - "analista/motores/afirmaciones.py"
      - "analista/motores/afirmaciones_compuesto_fase10.py"
      - "analista/motores/referencias_conceptuales_fase10.py"
      - "analista/motores/formulas.py"
      - "analista/motores/formulas_obra_fase10.py"
      - "analista/motores/formulas_perfil_fase10.py"
      - "analista/motores/relaciones_explicititas.py"
      - "analista/motores/relaciones_explicitas.py"
      - "analista/motores/relaciones_compuesto_fase10.py"
      - "analista/motores/limitadores.py"
      - "analista/motores/normalizacion.py"
      - "analista/motores/verificador_evidencia.py"
      - "analista/motores/validador_identidad_fase10.py"
      - "analista/motores/auditor_estructural.py"
      - "analista/motores/auditor_descriptivo.py"
      - "analista/motores/auditor_descriptivo_fase10.py"
      - "analista/motores/ensamblador_maestro.py"
      - "analista/pruebas/validar_inventario_fase10.py"
      - "analista/pruebas/validar_conceptos_obra_fase10.py"
      - "analista/pruebas/validar_extractores_conceptuales_fase10.py"
      - "analista/pruebas/validar_glosarios_reales_fase10.py"
      - "analista/pruebas/validar_definiciones_fase10.py"
      - "analista/pruebas/validar_identidad_conceptual_fase10.py"
      - "analista/pruebas/validar_enlaces_relaciones_fase10.py"
      - "analista/pruebas/validar_limitadores_fase10.py"
      - "analista/pruebas/validar_obra_fase10.py"
      - "analista/pruebas/validar_cierre_fase10.py"
      - "analista/pruebas/validar_maestro_fase9.py"
      - "analista/esquema/contratos-v1.0.0.schema.json"
      - "analista/esquema/expediente-maestro-v1.1.0.schema.json"
      - "analista/esquema/expediente-maestro-fase10-v1.*.schema.json"
      - "analista/calibracion/fase10/**"
      - "analista/generado/fuentes.jsonl"
      - "analista/generado/unidades.jsonl"
      - ".github/workflows/analista-fase10-cierre-global.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analista-fase10-cierre-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cierre-fase10:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema

      - name: Validar regresiones genéricas y glosarios reales
        run: |
          python analista/pruebas/validar_conceptos_obra_fase10.py
          python analista/pruebas/validar_extractores_conceptuales_fase10.py
          python analista/pruebas/validar_glosarios_reales_fase10.py
          python analista/pruebas/validar_definiciones_fase10.py
          python analista/pruebas/validar_identidad_conceptual_fase10.py
          python analista/pruebas/validar_enlaces_relaciones_fase10.py
          python analista/pruebas/validar_limitadores_fase10.py
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          p=Path('analista/motores/ensamblador_maestro_obra_fase10.py')
          s=importlib.util.spec_from_file_location('asm_f10_version',p); assert s and s.loader
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          assert m.SCHEMA_VERSION=='1.4.1'
          assert m.MOTOR_VERSION=='1.2.2'
          assert m.CONTROL_VERSION=='1.2.0'
          assert m.FIXED=={'conceptos_apariciones':'1.3.1','definiciones':'1.3.0','afirmaciones':'1.2.0','relaciones_explicitas':'1.2.1','limitadores':'1.1.1'}
          old=Path('analista/esquema/expediente-maestro-fase10-v1.4.0.schema.json')
          new=Path('analista/esquema/expediente-maestro-fase10-v1.4.1.schema.json')
          assert hashlib.sha256(old.read_bytes()).hexdigest()=='dba74318ac5ed4201c37ce9b3c301b80713fd3723a0acc6b5bf1d32d526b9727'
          schema=json.loads(new.read_text(encoding='utf-8'))
          assert schema['$id'].endswith('expediente-maestro-fase10-v1.4.1.schema.json')
          assert schema['properties']['schema_version']['const']=='1.4.1'
          assert schema['properties']['producido_por']['properties']['version']['const']=='1.2.2'
          assert schema['properties']['controles_fase10']['properties']['version']['const']=='1.2.0'
          print('OK Fase 10: esquema 1.4.1, ensamblador 1.2.2 y matriz cerrada coherentes; 1.4.0 intacto')
          PY

      - name: Ejecutar y validar las 20 obras hasta maestro independiente
        run: python analista/pruebas/validar_cierre_fase10.py

      - name: Publicar evidencia de cierre de Fase 10
        uses: actions/upload-artifact@v4
        with:
          name: analista-fase10-cierre-global
          path: |
            analista/generado/fase10/
            analista/generado/obras/
            analista/generado/maestros/
          if-no-files-found: error

      - name: Persistir productos deterministas y gate de cierre
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/fase10 analista/generado/obras analista/generado/maestros)" ]; then
            echo "Sin cambios generados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/fase10 analista/generado/obras analista/generado/maestros
          git commit -m "Cerrar productos documentales de Fase 10"
          git push origin HEAD:"${TARGET_BRANCH}"