name: Reorganizar ingesta inicial

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-reorganize'

permissions:
  contents: write

jobs:
  reorganizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reubicar fuentes y limpiar carga temporal
        shell: bash
        run: |
          set -euo pipefail
          test -d fuentes
          rm -rf corpus/fuentes
          mv fuentes corpus/fuentes

          if [ -f catalogo.json ]; then
            rm -f corpus/catalogo.json
            mv catalogo.json corpus/catalogo.json
          fi

          rm -rf 01-sobre-la-pasion 02-agape 03-damasen 04-areopago 05-caelus
          rm -rf caos juego-de-las-mascaras telar-de-las-moiras

      - name: Regenerar corpus segmentado y verificar integridad
        run: python scripts/segmentar_corpus.py

      - name: Guardar estructura canónica
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganizar ingesta inicial del corpus"
          git push
