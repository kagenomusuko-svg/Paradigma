name: Pulir temporalmente Caos capítulo 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pulir-caos-cap2.yml'

permissions:
  contents: write

jobs:
  pulir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver rayas residuales
        shell: python
        run: |
          from pathlib import Path

          p = Path('corpus/normalización/caos/capitulo-02.md')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              if line.startswith('«El límite es la forma que el infinito toma cuando se decide a ser algo.» —Miguel Hilario Olvera Aguilar'):
                  out.append(line)
                  continue
              # Sustituciones sintácticas conservadoras para rayas incidentales abiertas.
              line = line.replace(' —y ', ', y ')
              line = line.replace(' —aunque ', ', aunque ')
              line = line.replace(' —pero ', '; pero ')
              line = line.replace(' —porque ', ', porque ')
              line = line.replace(' —emerge ', '; emerge ')
              line = line.replace(' —es ', '; es ')
              line = line.replace(' —inferimos ', '; inferimos ')
              line = line.replace(' —solo ', '; solo ')
              line = line.replace(' —uno de ', ', uno de ')
              line = line.replace(' —del orden de ', ', del orden de ')
              line = line.replace(' —no ', ': no ')
              line = line.replace(' —que ', ', que ')
              line = line.replace(' —el ', ': el ')
              line = line.replace(' —la ', ': la ')
              line = line.replace(' —los ', ': los ')
              line = line.replace(' —las ', ': las ')
              line = line.replace(' —una ', ': una ')
              line = line.replace(' —un ', ': un ')
              line = line.replace(' —como ', ', como ')
              # Fallback: toda raya restante en prosa funciona como apertura explicativa.
              line = line.replace(' —', ': ')
              out.append(line)

          text = '\n'.join(out).rstrip() + '\n'
          if text.count('—') != 1:
              raise SystemExit(f'Quedaron {text.count("—")} rayas; se esperaba solo la atribución del epígrafe')
          p.write_text(text, encoding='utf-8')
          print('REMAINING_EM_DASHES:', text.count('—'))

      - name: Guardar y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pulir-caos-cap2.yml
          git add 'corpus/normalización/caos/capitulo-02.md'
          git commit -m '[MANT][NORMALIZACION] Pulir ortotipografía de Caos capítulo 2'
          git push
