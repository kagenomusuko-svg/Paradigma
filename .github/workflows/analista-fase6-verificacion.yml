name: Analista Fase 6 - verificacion

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - 'corpus/fuentes/**'
      - 'corpus/libros/**'
      - 'analista/esquema/**'
      - 'analista/motores/definiciones.py'
      - 'analista/motores/formulas.py'
      - 'analista/motores/relaciones_explicitas.py'
      - 'analista/motores/limitadores.py'
      - 'analista/motores/normalizacion.py'
      - 'analista/motores/verificador_evidencia.py'
      - 'analista/pruebas/validar_verificador_fase6.py'
      - '.github/workflows/analista-fase6-verificacion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de validacion
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Regenerar productos calibrados de Fase 4
        run: |
          python analista/motores/definiciones.py
          python analista/motores/formulas.py
          python analista/motores/relaciones_explicitas.py
          python analista/motores/limitadores.py

      - name: Regenerar normalizacion de Fase 5
        run: python analista/motores/normalizacion.py

      - name: Sellar evidencia mecanica
        run: python analista/motores/verificador_evidencia.py

      - name: Validar producto real de Fase 6
        run: python analista/pruebas/validar_verificador_fase6.py

      - name: Publicar artefacto verificado
        uses: actions/upload-artifact@v4
        with:
          name: analista-fase6-verificados
          path: analista/generado/verificados/*.jsonl
          if-no-files-found: error

      - name: Persistir producto verificado
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analista/generado/verificados
          if git diff --cached --quiet; then
            echo 'Sin cambios generados.'
          else
            git commit -m 'Generar registros verificados de Fase 6'
            git push
          fi
