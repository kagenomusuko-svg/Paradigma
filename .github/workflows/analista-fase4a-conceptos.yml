name: Analista Fase 4A - conceptos

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/motores/conceptos.py"
      - "analista/pruebas/validar_conceptos_fase4a.py"
      - "analista/esquema/**"
      - "analista/generado/fuentes.jsonl"
      - "analista/generado/unidades.jsonl"
      - "corpus/libros/afrodita-areia/01-sobre-la-pasion/**"
      - ".github/workflows/analista-fase4a-conceptos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  conceptos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet jsonschema

      - name: Generar conceptos y apariciones reales
        run: python analista/motores/conceptos.py

      - name: Validar clausura, cobertura y reproducibilidad
        run: python analista/pruebas/validar_conceptos_fase4a.py

      - uses: actions/upload-artifact@v4
        with:
          name: analista-fase4a-conceptos
          path: |
            analista/generado/apariciones-conceptuales.jsonl
            analista/generado/conceptos.jsonl
            analista/generado/cobertura-conceptos.jsonl
          if-no-files-found: error

      - name: Persistir productos deterministas
        if: github.actor != 'github-actions[bot]'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/apariciones-conceptuales.jsonl analista/generado/conceptos.jsonl analista/generado/cobertura-conceptos.jsonl)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/apariciones-conceptuales.jsonl analista/generado/conceptos.jsonl analista/generado/cobertura-conceptos.jsonl
          git commit -m "Generar conceptos y apariciones de Fase 4A"
          git push origin HEAD:"${TARGET_BRANCH}"
