name: Completar temporalmente bibliografía de Caos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-completar-caos-bibliografia.yml'

permissions:
  contents: write

jobs:
  completar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Completar bibliografía y corregir dos referencias dañadas
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata

          base = Path('corpus/normalización/caos')
          bib_path = base / '98-bibliografia.md'
          t = bib_path.read_text(encoding='utf-8')

          additions = {
            'A': [
              '**Aquino, Tomás de.** *Summa Theologiae.* 1265-1274. [Trad. esp.: *Suma Teológica.* Madrid: Biblioteca de Autores Cristianos, 1988.]',
              '**Aristóteles.** *Política.* Trad. Manuela García Valdés. Madrid: Gredos, 1988.',
            ],
            'B': [
              '**Bergson, Henri.** *Matière et mémoire.* París: Félix Alcan, 1896.',
              '**Bergson, Henri.** *L’Évolution créatrice.* París: Félix Alcan, 1907.',
              '**Bonanno, George A.** «Loss, Trauma, and Human Resilience: Have We Underestimated the Human Capacity to Thrive After Extremely Aversive Events?» *American Psychologist* 59, núm. 1 (2004): 20-28.',
            ],
            'C': [
              '**Campbell, Donald T.** «Downward Causation in Hierarchically Organised Biological Systems.» En *Studies in the Philosophy of Biology: Reduction and Related Problems*, eds. Francisco J. Ayala y Theodosius Dobzhansky, 179-186. Berkeley: University of California Press, 1974.',
              '**Camus, Albert.** *Le Mythe de Sisyphe.* París: Gallimard, 1942.',
              '**Chalmers, David J.** «Strong and Weak Emergence.» En *The Re-Emergence of Emergence: The Emergentist Hypothesis from Science to Religion*, eds. Philip Clayton y Paul Davies. Oxford: Oxford University Press, 2006.',
              '**Churchland, Paul M.** *Matter and Consciousness: A Contemporary Introduction to the Philosophy of Mind.* Cambridge, MA: MIT Press, 1984.',
              '**Churchland, Patricia S.** *Neurophilosophy: Toward a Unified Science of the Mind-Brain.* Cambridge, MA: MIT Press, 1986.',
              '**Cornford, Francis MacDonald.** *Plato’s Cosmology: The Timaeus of Plato.* Londres: Routledge & Kegan Paul, 1937.',
            ],
            'D': [
              '**Damasio, Antonio R.** *Descartes’ Error: Emotion, Reason, and the Human Brain.* Nueva York: Putnam, 1994.',
              '**Damasio, Antonio R.** *The Feeling of What Happens: Body and Emotion in the Making of Consciousness.* Nueva York: Harcourt Brace, 1999.',
              '**Dawkins, Richard.** *The Selfish Gene.* Oxford: Oxford University Press, 1976.',
              '**Deacon, Terrence W.** *Incomplete Nature: How Mind Emerged from Matter.* Nueva York: W. W. Norton, 2011.',
              '**Dennett, Daniel C.** *Consciousness Explained.* Boston: Little, Brown, 1991.',
              '**Descartes, René.** *Discours de la méthode.* Leiden: Jan Maire, 1637.',
              '**Descartes, René.** *Meditationes de prima philosophia.* París: Michel Soly, 1641.',
              '**De Waal, Frans.** *The Age of Empathy: Nature’s Lessons for a Kinder Society.* Nueva York: Harmony Books, 2009.',
              '**De Waal, Frans.** *Are We Smart Enough to Know How Smart Animals Are?* Nueva York: W. W. Norton, 2016.',
            ],
            'E': [
              '**Einstein, Albert.** «Zur Elektrodynamik bewegter Körper.» *Annalen der Physik* 17 (1905): 891-921.',
            ],
            'F': [
              '**Frankl, Viktor E.** *Ein Psychologe erlebt das Konzentrationslager.* Viena: Verlag für Jugend und Volk, 1946. [Trad. esp.: *El hombre en busca de sentido.*]',
              '**Frege, Gottlob.** «Über Sinn und Bedeutung.» *Zeitschrift für Philosophie und philosophische Kritik* 100 (1892): 25-50.',
            ],
            'H': [
              '**Hausdorff, Felix.** *Grundzüge der Mengenlehre.* Leipzig: Veit & Comp., 1914.',
              '**Hawking, Stephen W.** *A Brief History of Time: From the Big Bang to Black Holes.* Nueva York: Bantam Books, 1988.',
              '**Hawking, Stephen W. y Roger Penrose.** «The Singularities of Gravitational Collapse and Cosmology.» *Proceedings of the Royal Society of London A* 314, núm. 1519 (1970): 529-548.',
              '**Hegel, Georg Wilhelm Friedrich.** *Wissenschaft der Logik.* Núremberg: Johann Leonhard Schrag, 1812-1816.',
              '**Herman, Judith Lewis.** *Trauma and Recovery.* Nueva York: Basic Books, 1992.',
              '**Husserl, Edmund.** *Ideen zu einer reinen Phänomenologie und phänomenologischen Philosophie. Erstes Buch.* Halle: Niemeyer, 1913.',
              '**Husserl, Edmund.** *Vorlesungen zur Phänomenologie des inneren Zeitbewusstseins.* Ed. Martin Heidegger. Halle: Niemeyer, 1928.',
            ],
            'K': [
              '**Kierkegaard, Søren.** *Begrebet Angest.* Copenhague: Reitzel, 1844. [Trad. esp.: *El concepto de la angustia.*]',
            ],
            'L': [
              '**Lacan, Jacques.** «Le stade du miroir comme formateur de la fonction du Je.» En *Écrits.* París: Seuil, 1966. Conferencia presentada en 1949.',
              '**Levinas, Emmanuel.** *Autrement qu’être ou au-delà de l’essence.* La Haya: Nijhoff, 1974. [Trad. esp.: *De otro modo que ser o más allá de la esencia.*]',
              '**Lorenz, Edward N.** «Deterministic Nonperiodic Flow.» *Journal of the Atmospheric Sciences* 20, núm. 2 (1963): 130-141.',
            ],
            'M': [
              '**Mandelbrot, Benoît B.** *Les objets fractals: forme, hasard et dimension.* París: Flammarion, 1975.',
              '**Mandelbrot, Benoît B.** *The Fractal Geometry of Nature.* San Francisco: W. H. Freeman, 1982.',
              '**Marx, Karl.** «Thesen über Feuerbach.» 1845. En *Marx-Engels Werke*, vol. 3. Berlín: Dietz, 1958.',
              '**Maturana, Humberto R. y Francisco J. Varela.** *El árbol del conocimiento.* Santiago de Chile: Editorial Universitaria, 1984.',
              '**McTaggart, J. M. E.** «The Unreality of Time.» *Mind* 17, núm. 68 (1908): 457-474.',
              '**Mead, George Herbert.** *Mind, Self, and Society from the Standpoint of a Social Behaviorist.* Chicago: University of Chicago Press, 1934.',
              '**Merleau-Ponty, Maurice.** *Le Visible et l’Invisible.* Ed. Claude Lefort. París: Gallimard, 1964.',
              '**Metzinger, Thomas.** *The Ego Tunnel: The Science of the Mind and the Myth of the Self.* Nueva York: Basic Books, 2009.',
              '**Minkowski, Hermann.** «Raum und Zeit.» *Physikalische Zeitschrift* 10 (1909): 104-111. Conferencia pronunciada en 1908.',
            ],
            'N': [
              '**Nader, Karim, Glenn E. Schafe y Joseph E. LeDoux.** «Fear Memories Require Protein Synthesis in the Amygdala for Reconsolidation after Retrieval.» *Nature* 406 (2000): 722-726.',
              '**Nagel, Thomas.** «What Is It Like to Be a Bat?» *Philosophical Review* 83, núm. 4 (1974): 435-450.',
              '**Nietzsche, Friedrich.** *Die fröhliche Wissenschaft.* Chemnitz: Schmeitzner, 1882. [Trad. esp.: *La gaya ciencia.*]',
            ],
            'O': [
              '**Ovidio.** *Metamorfosis.* Libro I. Trad. Consuelo Álvarez y Rosa María Iglesias. Madrid: Cátedra, 1995.',
            ],
            'P': [
              '**Pascal, Blaise.** *Pensées de M. Pascal sur la religion et sur quelques autres sujets.* París: Guillaume Desprez, 1670.',
              '**Penrose, Roger.** *Cycles of Time: An Extraordinary New View of the Universe.* Londres: Bodley Head, 2010. [Trad. esp.: *Ciclos del tiempo.*]',
              '**Platón.** *Timeo.* En *Diálogos VI.* Trad. María Ángeles Durán y Francisco Lisi. Madrid: Gredos, 1992.',
              '**Poincaré, Henri.** *La Science et l’hypothèse.* París: Flammarion, 1902. [Trad. esp.: *La ciencia y la hipótesis.*]',
              '**Prigogine, Ilya e Isabelle Stengers.** *La Nouvelle Alliance: Métamorphose de la science.* París: Gallimard, 1979.',
              '**Proust, Marcel.** *À la recherche du temps perdu.* 7 vols. París: Grasset/Gallimard, 1913-1927.',
            ],
            'S': [
              '**Sacks, Oliver.** *The Man Who Mistook His Wife for a Hat.* Londres: Duckworth, 1985. [Trad. esp.: *El hombre que confundió a su mujer con un sombrero.*]',
              '**Sacks, Oliver.** *Musicophilia: Tales of Music and the Brain.* Nueva York: Knopf, 2007. [Trad. esp.: *Musicofilia.*]',
              '**Simplicio de Cilicia.** *In Aristotelis Physicorum libros commentaria.* Ed. Hermann Diels. Berlín: Reimer, 1882-1895.',
            ],
            'V': [
              '**Van der Kolk, Bessel A.** *The Body Keeps the Score: Brain, Mind, and Body in the Healing of Trauma.* Nueva York: Viking, 2014.',
              '**Varela, Francisco J., Evan Thompson y Eleanor Rosch.** *The Embodied Mind: Cognitive Science and Human Experience.* Cambridge, MA: MIT Press, 1991. [Trad. esp.: *De cuerpo presente.*]',
              '**Vernant, Jean-Pierre.** *Les Origines de la pensée grecque.* París: Presses Universitaires de France, 1962.',
              '**Von Wright, Georg Henrik.** *Norm and Action: A Logical Enquiry.* Londres: Routledge & Kegan Paul, 1963.',
            ],
            'W': [
              '**Weierstrass, Karl.** *Einleitung in die Theorien der analytischen Functionen.* Berlín, 1874. Apuntes manuscritos de curso conservados en transcripciones de estudiantes.',
              '**Weiss, Paul.** «The Cell as Unit.» *Journal of Theoretical Biology* 5, núm. 3 (1963): 389-397.',
            ],
            'Z': [
              '**Zurek, Wojciech H.** «Decoherence and the Transition from Quantum to Classical.» *Physics Today* 44, núm. 10 (1991): 36-44.',
            ],
          }

          # Parsear la bibliografía actual por secciones y conservar el preámbulo.
          m = re.search(r'\n## A\n', t)
          if not m:
              raise SystemExit('No se encontró el inicio alfabético de la bibliografía.')
          preamble = t[:m.start()].rstrip()
          sections = {}
          for sm in re.finditer(r'^## ([A-Z])\n', t, flags=re.M):
              letter = sm.group(1)
              start = sm.end()
              nm = re.search(r'^## [A-Z]\n', t[start:], flags=re.M)
              end = start + nm.start() if nm else len(t)
              body = t[start:end].strip()
              entries = [x.strip() for x in re.split(r'\n\s*\n', body) if x.strip()]
              sections[letter] = entries

          # Insertar nuevas entradas sin duplicados exactos y ordenar por autor/título visible.
          for letter, new_entries in additions.items():
              sections.setdefault(letter, [])
              for e in new_entries:
                  if e not in sections[letter]:
                      sections[letter].append(e)

          def sort_key(entry):
              mm = re.match(r'\*\*(.*?)\*\*\s*(.*)', entry)
              raw = (mm.group(1) + ' ' + mm.group(2)) if mm else entry
              raw = ''.join(c for c in unicodedata.normalize('NFD', raw.lower()) if unicodedata.category(c) != 'Mn')
              return raw

          out = [preamble]
          for letter in sorted(sections):
              out.append(f'## {letter}')
              out.extend(sorted(sections[letter], key=sort_key))
          t2 = '\n\n'.join(out).rstrip() + '\n'
          # Puntuación fuera de cursivas en dos residuos de la fuente.
          t2 = t2.replace('*Obras completas,*', '*Obras completas*,')
          t2 = t2.replace('*Los presocráticos,*', '*Los presocráticos*,')
          bib_path.write_text(t2, encoding='utf-8')

          # Reparación bibliográfica cruzada: Sacks / Clive Wearing.
          cap1 = base/'capitulo-01.md'
          c1 = cap1.read_text(encoding='utf-8')
          old = 'Sacks, Oliver. El hombre que confundió a su mujer con un sombrero (1985), especialmente el caso de Jimmy G. («El marinero perdido»), y El hombre que no podía detener el tiempo. Los casos de amnesia severa (particularmente el del músico Clive Wearing, descrito en su libro del mismo nombre)'
          new = 'Sacks, Oliver. El hombre que confundió a su mujer con un sombrero (1985), especialmente el caso de Jimmie G. («El marinero perdido»), y Musicofilia (2007), donde aborda el caso del músico Clive Wearing. Los casos de amnesia severa (particularmente el de Wearing)'
          if old not in c1:
              raise SystemExit('No se encontró el pasaje de Sacks que debía repararse.')
          cap1.write_text(c1.replace(old,new,1), encoding='utf-8')

          # Reparación bibliográfica cruzada: Weiss.
          cap4 = base/'capitulo-04.md'
          c4 = cap4.read_text(encoding='utf-8')
          oldw = 'Weiss, Paul. «The Cell as Unit» (1940), Journal of General Physiology.'
          neww = 'Weiss, Paul. «The Cell as Unit» (1963), Journal of Theoretical Biology 5, núm. 3: 389-397.'
          if oldw not in c4:
              raise SystemExit('No se encontró el pasaje de Weiss que debía repararse.')
          cap4.write_text(c4.replace(oldw,neww,1), encoding='utf-8')

          # Auditoría formal de bibliografía.
          final = bib_path.read_text(encoding='utf-8')
          lines = final.splitlines()
          entries = [ln for ln in lines if ln.startswith('**')]
          bad_headings = [(i+1,ln) for i,ln in enumerate(lines) if ln.startswith('##') and not re.fullmatch(r'## [A-Z]',ln)]
          straight = [(i+1,ln) for i,ln in enumerate(lines) if '"' in ln]
          prohibited = {c:final.count(c) for c in ['—','–','□','�']}
          dupes = sorted({e for e in entries if entries.count(e)>1})
          nonentries=[]
          for i,ln in enumerate(lines):
              if not ln.strip() or ln.startswith('#') or ln.startswith('*Se incluyen') or ln.startswith('**'):
                  continue
              nonentries.append((i+1,ln))
          print('ENTRADAS_FINAL',len(entries))
          print('BAD_HEADINGS',bad_headings)
          print('COMILLAS_RECTAS',straight)
          print('PROHIBIDOS',prohibited)
          print('DUPLICADOS',dupes)
          print('LINEAS_SUELTAS',nonentries)
          if bad_headings or straight or any(prohibited.values()) or dupes or nonentries:
              raise SystemExit('Falló la auditoría formal de la bibliografía completada.')

          # Auditoría de pares autor-año; se reporta para revisión final, no se toma ciegamente como error.
          def fold(s):
              return ''.join(c for c in unicodedata.normalize('NFD',s.lower()) if unicodedata.category(c)!='Mn')
          pat=re.compile(r'\b([A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñïëöäßØø-]{2,}),\s+[A-ZÁÉÍÓÚÜÑ][^\n]{0,180}?\b((?:1[5-9]|20)\d{2})\b')
          residual=[]
          for p in sorted(base.glob('*.md')):
              if p.name=='98-bibliografia.md': continue
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '<a id="fn-' not in line or '**Nota editorial.**' in line: continue
                  clean=re.sub(r'<[^>]+>','',line)
                  for mm in pat.finditer(clean):
                      surname,year=mm.group(1),mm.group(2)
                      hit=any(ln.startswith('**') and fold(surname) in fold(ln) and year in ln for ln in lines)
                      if not hit:
                          residual.append((surname,year,p.name,clean[:350]))
          seen=set(); uniq=[]
          for x in residual:
              k=x[:2]
              if k not in seen:
                  seen.add(k); uniq.append(x)
          print('PARES_RESIDUALES',len(uniq))
          for x in uniq: print('RESIDUAL',x)

      - name: Guardar cierre y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-completar-caos-bibliografia.yml
          git add 'corpus/normalización/caos/98-bibliografia.md' 'corpus/normalización/caos/capitulo-01.md' 'corpus/normalización/caos/capitulo-04.md'
          git commit -m '[MANT][NORMALIZACION] Completar bibliografía de Caos'
          git push
