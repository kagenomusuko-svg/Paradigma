name: Normalizar temporalmente Caos capítulo 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalizar-caos-cap7.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalizar capítulo, notas y cierre formal
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata
          src=Path('corpus/libros/caos/capitulo-07.md')
          dst=Path('corpus/normalización/caos/capitulo-07.md')
          t=unicodedata.normalize('NFC',src.read_text(encoding='utf-8'))

          t=t.replace(
              '*La respuesta a Hume «No necesito demostrar que el universo tiene causas. Solo necesito demostrar que tú eres la causa de tus actos.»* — Miguel Hilario Olvera Aguilar',
              '*La respuesta a Hume*\n\n«No necesito demostrar que el universo tiene causas. Solo necesito demostrar que tú eres la causa de tus actos.» —Miguel Hilario Olvera Aguilar'
          )

          corrections={
              ' — Hume tiene razón':' (Hume tiene razón)',
              ' — que Kant necesita para fundar la responsabilidad moral—':' (que Kant necesita para fundar la responsabilidad moral)',
              ' — libremente autodeterminado más allá de la naturaleza.':' (libremente autodeterminado más allá de la naturaleza).',
              ' — empresa que excede los propósitos de este libro—':' (empresa que excede los propósitos de este libro)',
              ' — el ego—':' (el ego)',
              ' — desde la condición más radical':' (desde la condición más radical',
              'determinación—, no desde':'determinación), no desde',
              ' — siempre en el presente':' (siempre en el presente',
              'identidad— es':'identidad) es',
              'punto x igual a cero':'punto x = 0',
              'Parmenides, DK':'Parménides, DK',
              'Heraclíteo':'heraclíteo',
              'Parmenídeo':'parmenídeo',
              'no-ser':'no ser',
          }
          for a,b in corrections.items():
              t=t.replace(a,b)

          # Convertir incisos cerrados por rayas en paréntesis cuando la estructura es inequívoca.
          inciso=re.compile(r'\s—\s*([^—\n]{1,650}?)\s*—(?=[,.;:?!)]|\s)')
          while inciso.search(t):
              t=inciso.sub(lambda m:' ('+m.group(1).strip()+')',t)

          # Comillas españolas fuera de etiquetas HTML.
          def quotes_line(line):
              out=[]; in_tag=False; opening=True
              for ch in line:
                  if ch=='<': in_tag=True
                  if ch=='"' and not in_tag:
                      out.append('«' if opening else '»'); opening=not opening
                  else:
                      out.append(ch)
                  if ch=='>': in_tag=False
              return ''.join(out)
          t='\n'.join(quotes_line(line) for line in t.split('\n'))

          # Quitar numeración plana duplicada de las notas existentes.
          t=re.sub(r'(<a id="fn-main-(\d+)"></a><sup>\2</sup>)\s+\d+\s+',r'\1 ',t)

          # Reconstruir las llamadas y notas 172-173 mediante remisión interna.
          for n in (172,173):
              t=t.replace(f'<sup>{n}</sup>',f'<sup id="fnref-main-{n}"><a href="#fn-main-{n}">{n}</a></sup>')
          n172='<a id="fn-main-172"></a><sup>172</sup> Véase la nota 168, sobre Parménides y el sujeto como condición previa al primer colapso.'
          n173='<a id="fn-main-173"></a><sup>173</sup> Véase la nota 171, sobre Hesíodo y el caos como condición de posibilidad del colapso.'
          marker174='<a id="fn-main-174"></a><sup>174</sup>'
          if marker174 not in t: raise SystemExit('No se encontró nota 174.')
          t=t.replace(marker174,n172+'\n\n'+n173+'\n\n'+marker174,1)

          # Nota editorial única: clausura formal de la integral en la muerte.
          call='El ego que muere se convierte en respuesta: la integral se cierra, la función adquiere su forma definitiva, el ego es finalmente todo lo que fue.'
          if call not in t: raise SystemExit('No se encontró el pasaje de cierre de la integral.')
          t=t.replace(call,call+'<sup id="fnref-ed-cap7"><a href="#fn-ed-cap7">†</a></sup>',1)
          ednote=(
              '<a id="fn-ed-cap7"></a><sup>†</sup> **Nota editorial.** El mapa maestro mantiene abierta una revisión formal sobre esta clausura: *Caos* afirma que la muerte cierra la integral y fija la forma total del ego, pero las condiciones topológicas necesarias para derivar formalmente clausura, límite o perfección del conjunto no quedan especificadas. Esta edición conserva la tesis del capítulo y señala únicamente la tensión formal, sin sustituirla por una formalización posterior.'
          )
          marker156='<a id="fn-main-156"></a><sup>156</sup>'
          t=t.replace(marker156,ednote+'\n\n'+marker156,1)

          t=t.replace('–','-')
          t=re.sub(r'[ \t]+\n','\n',t)
          t=re.sub(r'\n{4,}','\n\n\n',t).rstrip()+'\n'
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(t,encoding='utf-8')

          refs=[int(x) for x in re.findall(r'href="#fn-main-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>',t)]
          print('MISSING_REFERENCED_NOTES',sorted(set(refs)-set(notes)))
          print('ORPHAN_NOTES',sorted(set(notes)-set(refs)))
          print('MISSING_156_176',[n for n in range(156,177) if n not in notes])
          print('EM_DASHES',t.count('—'),'EN_DASHES',t.count('–'),'REPL',t.count('�'),'BOX',t.count('□'))
          print('SUSPICIOUS_COMPOUNDS',sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b',t))))
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line:
                  print(f'DASH_LINE {i}: {line[:1800]}')
          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)) or [n for n in range(156,177) if n not in notes]:
              raise SystemExit('Auditoría de notas falló.')
          if '–' in t or '�' in t or '□' in t:
              raise SystemExit('Persisten caracteres prohibidos o corruptos.')
      - name: Guardar normalización y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalizar-caos-cap7.yml
          git add 'corpus/normalización/caos/capitulo-07.md'
          git commit -m '[MANT][NORMALIZACION] Normalizar capítulo 7 de Caos'
          git push
