name: Cerrar temporalmente Caos capítulo 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cerrar-caos-cap3.yml'

permissions:
  contents: write

jobs:
  cerrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retirar duplicación editorial y cerrar ortotipografía
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('corpus/normalización/caos/capitulo-03.md')
          text = p.read_text(encoding='utf-8')

          duplicate = (
              'La segunda contribución viene de la mecánica cuántica. En la interpretación de Everett (los Muchos Mundos) todos los eventos posibles se actualizan en alguna rama del universo. '
              'Cada colapso de la función de onda que en la interpretación de Copenhague determina un único resultado, en la interpretación de Everett produce una ramificación del universo que actualiza todos los\n\n'
              'Minkowski mostró que la relatividad especial de Einstein puede entenderse geométricamente: el espacio y el tiempo no son entidades separadas sino dos aspectos de una sola entidad, el espacio-tiempo cuadridimensional. '
              'En el espacio-tiempo de Minkowski, todos los eventos pasados, presentes y futuros existen como puntos de un espacio cuadridimensional estático: el «bloque del universo». '
              'Lo que experimentamos como el flujo del tiempo es el movimiento de nuestra conciencia a lo largo de la coordenada temporal de ese bloque. Esta visión del «universo bloque» apoya filosóficamente la tesis de que todos los eventos coexisten en una estructura atemporal.\n\n'
              'resultados posibles simultáneamente.'
          )
          repaired = (
              'La segunda contribución viene de la mecánica cuántica. En la interpretación de Everett (los Muchos Mundos) todos los eventos posibles se actualizan en alguna rama del universo. '
              'Cada colapso de la función de onda que en la interpretación de Copenhague determina un único resultado, en la interpretación de Everett produce una ramificación del universo que actualiza todos los resultados posibles simultáneamente.'
          )
          if duplicate not in text:
              raise SystemExit('No se encontró el bloque duplicado de Minkowski esperado.')
          text = text.replace(duplicate, repaired, 1)

          # Correcciones ortotipográficas inequívocas restantes.
          text = text.replace('Minkowsky', 'Minkowski')
          text = text.replace('13,800 millones', '13 800 millones')
          text = text.replace('desorden-que-debe-ser-ordenado', 'desorden que debe ser ordenado')
          text = text.replace('co-produce', 'coproduce')
          text = text.replace('co-producida', 'coproducida')
          text = text.replace('co-producido', 'coproducido')
          text = text.replace('inter-corporalidad', 'intercorporalidad')

          refs = [int(x) for x in re.findall(r'href="#fn-main-(\d+)"', text)]
          notes = [int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>', text)]
          print('MISSING_REFERENCED_NOTES:', sorted(set(refs) - set(notes)))
          print('ORPHAN_NOTES:', sorted(set(notes) - set(refs)))
          print('REMAINING_EM_DASHES:', text.count('—'))
          print('REMAINING_EN_DASHES:', text.count('–'))
          print('DUPLICATED_MINKOWSKI_BLOCKS:', text.count('Minkowski mostró que la relatividad especial de Einstein puede entenderse geométricamente'))
          print('SUSPICIOUS_COMPOUNDS:', sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b', text))))
          if sorted(set(refs) - set(notes)) or sorted(set(notes) - set(refs)):
              raise SystemExit('La auditoría de notas dejó inconsistencias.')
          if text.count('—') != 1 or '–' in text:
              raise SystemExit('La auditoría de rayas no quedó limpia.')
          if text.count('Minkowski mostró que la relatividad especial de Einstein puede entenderse geométricamente') != 0:
              raise SystemExit('Persistió el párrafo duplicado de Minkowski.')

          p.write_text(text, encoding='utf-8')

      - name: Guardar y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-cerrar-caos-cap3.yml
          git add 'corpus/normalización/caos/capitulo-03.md'
          git commit -m '[MANT][NORMALIZACION] Cerrar revisión editorial de Caos capítulo 3'
          git push
