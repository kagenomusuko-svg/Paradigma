name: Analista Fase 5 - normalizacion

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/motores/normalizacion.py"
      - "analista/pruebas/validar_normalizacion_fase5.py"
      - "analista/motores/conceptos.py"
      - "analista/motores/definiciones.py"
      - "analista/motores/formulas.py"
      - "analista/motores/relaciones_explicitas.py"
      - "analista/motores/limitadores.py"
      - "analista/esquema/**"
      - "analista/generado/apariciones-conceptuales.jsonl"
      - "analista/generado/conceptos.jsonl"
      - "analista/generado/definiciones.jsonl"
      - "analista/generado/afirmaciones-candidatas.jsonl"
      - "analista/generado/formulas-candidatas.jsonl"
      - "analista/generado/relaciones-explicitas.jsonl"
      - "analista/generado/distinciones.jsonl"
      - "analista/generado/negaciones.jsonl"
      - "analista/generado/excepciones.jsonl"
      - "analista/generado/restricciones-alcance.jsonl"
      - ".github/workflows/analista-fase5-normalizacion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalizacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - name: Regenerar productos calibrados de Fase 4
        run: |
          python analista/motores/conceptos.py
          python analista/motores/definiciones.py
          python analista/motores/formulas.py
          python analista/motores/relaciones_explicitas.py
          python analista/motores/limitadores.py
      - name: Generar overlay normalizado
        run: python analista/motores/normalizacion.py
      - name: Validar clausura de normalización
        run: python analista/pruebas/validar_normalizacion_fase5.py
      - uses: actions/upload-artifact@v4
        with:
          name: analista-fase5-normalizados
          path: analista/generado/normalizados/
          if-no-files-found: error
      - name: Persistir overlay determinista
        if: github.actor != 'github-actions[bot]'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/normalizados)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/normalizados
          git commit -m "Generar normalización de Fase 5"
          git push origin HEAD:"${TARGET_BRANCH}"
