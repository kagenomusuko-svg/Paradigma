name: Normalizar temporalmente Caos apéndice 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalizar-caos-ap3.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Primera pasada material del glosario
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata
          src=Path('corpus/libros/caos/apendice-03.md')
          dst=Path('corpus/normalización/caos/apendice-03.md')
          t=unicodedata.normalize('NFC',src.read_text(encoding='utf-8'))

          # Reconstrucción de la notación dañada de la integral y suma discreta.
          t=t.replace('I(t) = ∫□ᵗ c(τ) w(τ) dτ', 'I(t) = ∫₀ᵗ c(τ) w(τ) dτ')
          t=t.replace('Σ□□□ⁿ c(τ□) w(τ□) Δτ', 'Σᵢ₌₁ⁿ c(τᵢ) w(τᵢ) Δτ')

          # Restaurar dos entradas que quedaron como rótulos inline en vez de entradas del glosario.
          t=t.replace('**EGO**  *s.m.* **1. (definición nuclear)**', '### EGO  s.m.\n\n**1. (definición nuclear)**')
          t=t.replace('**CONDICIÓN SINE QUA NON**  *loc. lat.* **1.**', '### CONDICIÓN SINE QUA NON  loc. lat.\n\n**1.**')

          # Reparar cortes de maquetación inequívocos.
          repairs={
            'Si E es el espacio de posibilidades del ego y c: T → E es la función que asigna a cada\n\nmomento t ∈ T el colapso que ocurrió en ese\n\nmomento, entonces': 'Si E es el espacio de posibilidades del ego y c: T → E es la función que asigna a cada momento t ∈ T el colapso que ocurrió en ese momento, entonces',
            'La primera mediación\n\nselecciona un acto a ∈ A en función de la orientación de la voluntad v ∈ V y las condiciones del campo c ∈\n\nC.': 'La primera mediación selecciona un acto a ∈ A en función de la orientación de la voluntad v ∈ V y las condiciones del campo c ∈ C.',
            'φ₁: V × C → A    (primera mediación como función de\n\nselección del acto)': 'φ₁: V × C → A    (primera mediación como función de selección del acto)',
            'la segunda mediación es la operación φ₂: A × I → I\' que produce\n\nla integral modificada I\' = I ∪ {a}: la integral que\n\nincluye': 'la segunda mediación es la operación φ₂: A × I → I\' que produce la integral modificada I\' = I ∪ {a}: la integral que incluye',
            'φ₂: A × I → I\'    (segunda mediación como modificación\n\nde la integral)': 'φ₂: A × I → I\'    (segunda mediación como modificación de la integral)',
            'En sentido estricto: el resultado de la primera mediación\n\na ∈ A, antes de ser integrado por la segunda mediación\n\na la integral del ego.': 'En sentido estricto: el resultado de la primera mediación a ∈ A, antes de ser integrado por la segunda mediación a la integral del ego.',
          }
          for a,b in repairs.items(): t=t.replace(a,b)

          # Quitar numeración auxiliar duplicada de las notas 34–43.
          t=re.sub(r'(<a id="fn-app-(\d+)"></a><sup>\2</sup>)\s+\d+\s+',r'\1 ',t)

          # Comillas españolas fuera de etiquetas HTML.
          def spanish_quotes(line):
              parts=re.split(r'(<[^>]+>)',line)
              for i,part in enumerate(parts):
                  if part.startswith('<') and part.endswith('>'): continue
                  parts[i]=re.sub(r'"([^"\n]+)"',r'«\1»',part)
              return ''.join(parts)
          t='\n'.join(spanish_quotes(line) for line in t.split('\n'))

          # Incisos cerrados inequívocos.
          inciso=re.compile(r'\s—\s*([^—\n]{1,800}?)\s*—(?=[,.;:?!)]|\s)')
          while inciso.search(t):
              t=inciso.sub(lambda m:' ('+m.group(1).strip()+')',t)

          # Normalización de compuestos artificiales, sin tocar nombres propios.
          t=t.replace('cuasi-automática','cuasiautomática')
          t=t.replace('pre-reflexiva','prerreflexiva')
          t=t.replace('proto-intencionalidad','protointencionalidad')
          t=t.replace('nóesis-nóema','nóesis/nóema')
          t=t.replace('pasado-presente-futuro','pasado, presente y futuro')
          t=t.replace('test but-for','test *but for*')

          # Precisiones editoriales propias del glosario: tensiones históricas reales del mapa maestro.
          call_med='La distinción entre mediación neutral y primera mediación no es dicotómica en la escala de los seres vivos: el animal ocupa una posición intermedia con protointencionalidad y capacidades análogas a la primera mediación sin la reflexividad plena que la primera mediación del ego requiere.'
          t=t.replace(call_med,call_med+'<sup id="fnref-ed-ap3-med"><a href="#fn-ed-ap3-med">†</a></sup>',1)

          call_phi2='La segunda mediación tiene una dimensión normativa además de descriptiva: no todos los modos de integrar el acto a la integral producen la misma función.'
          t=t.replace(call_phi2,call_phi2+'<sup id="fnref-ed-ap3-phi2"><a href="#fn-ed-ap3-phi2">‡</a></sup>',1)

          call_int='La integral acumulativa es el modelo matemático de la identidad del ego a lo largo del tiempo.'
          t=t.replace(call_int,call_int+'<sup id="fnref-ed-ap3-int"><a href="#fn-ed-ap3-int">§</a></sup>',1)

          call_ego='La definición del ego en esta ontología es funcional, no sustancial.'
          t=t.replace(call_ego,call_ego+'<sup id="fnref-ed-ap3-ego"><a href="#fn-ed-ap3-ego">¶</a></sup>',1)

          call_id='La identidad del ego no implica transparencia del ego a sí mismo.'
          t=t.replace(call_id,call_id+'<sup id="fnref-ed-ap3-id"><a href="#fn-ed-ap3-id">‖</a></sup>',1)

          call_resp='La responsabilidad nace en la primera mediación, no en el resultado.'
          t=t.replace(call_resp,call_resp+'<sup id="fnref-ed-ap3-resp"><a href="#fn-ed-ap3-resp">※</a></sup>',1)

          ednotes=(
            '<a id="fn-ed-ap3-med"></a><sup>†</sup> **Nota editorial.** En *Caos*, «mediación neutral» designa la determinación sin intencionalidad y «primera mediación» la orientación intencional propia del ego. Obras posteriores introducen retrospectivamente expresiones como «mediación prima» o «primera mediación en sentido material» y, en algunos casos, atribuyen ese vocabulario a *Caos*. El mapa maestro mantiene esa atribución en revisión porque la fuente canónica de *Caos* no usa esos términos con ese sentido. Esta edición conserva y explicita el vocabulario histórico propio de *Caos*.\n\n'
            '<a id="fn-ed-ap3-phi2"></a><sup>‡</sup> **Nota editorial.** En *Caos*, φ₂/segunda mediación ocurre después del acto y consiste en integrar el resultado a la función acumulativa. Obras posteriores desplazan parcialmente φ₂ hacia funciones de reconocimiento, selección, modulación o evaluación que pueden operar en otras posiciones de la secuencia. El mapa maestro no adjudica todavía si esos usos sustituyen, amplían o son homónimos respecto de la definición de *Caos*; por ello este glosario fija explícitamente el sentido histórico de esta obra.\n\n'
            '<a id="fn-ed-ap3-int"></a><sup>§</sup> **Nota editorial.** La notación de *Caos* usa I a la vez como integral ponderada, estado acumulativo y objeto actualizable mediante I\' = I ∪ {a}. El mapa maestro mantiene pendiente su tipado formal conjunto. También mantiene abierta la justificación topológica de la tesis de que la muerte «cierra» la integral o produce un conjunto cerrado/perfecto. Este glosario conserva ambas formulaciones como definiciones internas de *Caos*, sin introducir una regularización matemática posterior.\n\n'
            '<a id="fn-ed-ap3-ego"></a><sup>¶</sup> **Nota editorial.** «Ego» no mantiene una única caracterización transversal en todo el corpus posterior: además del ego como proceso e integral histórica de *Caos*, aparecen formulaciones como eje persistente, posición formal o estructura sin inercia propia. El mapa maestro conserva esas relaciones sin jerarquizarlas. En este glosario, «ego» significa exclusivamente el concepto definido por *Caos*: proceso constituido por doble mediación e integral acumulativa.\n\n'
            '<a id="fn-ed-ap3-id"></a><sup>‖</sup> **Nota editorial.** «Identidad» es un término homónimo en el corpus: *Caos* la define como continuidad funcional de la integral; obras posteriores la usan también para sesgo pre-egóico, mascarada o identidad narrativa asumible. Ninguna fuente posterior establece una equivalencia general entre esos objetos. Esta entrada explicita, por tanto, únicamente la identidad del ego en el sentido técnico de *Caos*.\n\n'
            '<a id="fn-ed-ap3-resp"></a><sup>※</sup> **Nota editorial.** *Caos* funda la responsabilidad en la primera mediación y la relación causal del ego con el acto. Obras posteriores la sitúan, según el contexto, en la asunción por φ₂ o vuelven a la imputación exterior fundada en φ₁. El mapa maestro mantiene abierta la relación entre responsabilidad causal, ontológica, moral y jurídica. Esta entrada fija el uso de *Caos* sin resolver retrospectivamente esas redistribuciones.\n\n'
          )
          marker='<a id="fn-app-34"></a><sup>34</sup>'
          t=t.replace(marker,ednotes+marker,1)

          t=re.sub(r'\s+([,.;:?!])',r'\1',t)
          t=re.sub(r'[ \t]+\n','\n',t)

          refs=[int(x) for x in re.findall(r'href="#fn-app-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-app-(\d+)"></a>',t)]
          edrefs=set(re.findall(r'href="#(fn-ed-ap3-[^"]+)"',t))
          edanchors=set(re.findall(r'<a id="(fn-ed-ap3-[^"]+)"></a>',t))
          print('BOXES',t.count('□'),'EN_DASHES',t.count('–'),'EM_DASHES',t.count('—'))
          print('MISSING',sorted(set(refs)-set(notes)),'ORPHAN',sorted(set(notes)-set(refs)))
          print('MISSING_34_43',[n for n in range(34,44) if n not in notes])
          print('MISSING_ED',sorted(edrefs-edanchors),'ORPHAN_ED',sorted(edanchors-edrefs))
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line:
                  print(f'DASH {i}: {line[:1800]}')
          if '□' in t or '�' in t or '–' in t:
              raise SystemExit('Persisten caracteres corruptos o guion medio.')
          if set(refs)!=set(notes) or [n for n in range(34,44) if n not in notes] or edrefs!=edanchors:
              raise SystemExit('Auditoría de notas falló.')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(t.rstrip()+'\n',encoding='utf-8')
      - name: Guardar primera pasada y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalizar-caos-ap3.yml
          git add 'corpus/normalización/caos/apendice-03.md'
          git commit -m '[MANT][NORMALIZACION] Normalizar primera pasada de Caos apéndice 3'
          git push
