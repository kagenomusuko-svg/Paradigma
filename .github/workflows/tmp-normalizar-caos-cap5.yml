name: Normalizar temporalmente Caos capítulo 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalizar-caos-cap5.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalizar capítulo y añadir nota editorial mínima
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata
          src = Path('corpus/libros/caos/capitulo-05.md')
          dst = Path('corpus/normalización/caos/capitulo-05.md')
          original = src.read_text(encoding='utf-8')
          t = unicodedata.normalize('NFC', original)

          t = t.replace(
              '*El mundo se determina sin ego «Un martillo no elige el clavo. Un ego sí elige el martillo.»* — Miguel Hilario Olvera Aguilar',
              '*El mundo se determina sin ego*\n\n«Un martillo no elige el clavo. Un ego sí elige el martillo.» —Miguel Hilario Olvera Aguilar'
          )

          corrections = {
              'merece ser descripta con su propia precisión': 'merece ser descrita con su propia precisión',
              'cuasi-automática': 'cuasiautomática',
              '"Umwelt" —un mundo-propio—': '"Umwelt" (un mundo propio)',
              'mundo-propio': 'mundo propio',
          }
          for a,b in corrections.items():
              t = t.replace(a,b)

          # Convertir incisos cerrados con raya en paréntesis.
          inciso = re.compile(r'\s—\s*([^—\n]{1,500}?)\s*—(?=[,.;:?!)]|\s)')
          while inciso.search(t):
              t = inciso.sub(lambda m: ' (' + m.group(1).strip() + ')', t)

          # Comillas españolas en texto, sin alterar etiquetas HTML.
          def quotes_line(line):
              out=[]; in_tag=False; opening=True
              for ch in line:
                  if ch == '<': in_tag=True
                  if ch == '"' and not in_tag:
                      out.append('«' if opening else '»'); opening = not opening
                  else:
                      out.append(ch)
                  if ch == '>': in_tag=False
              return ''.join(out)
          t = '\n'.join(quotes_line(line) for line in t.split('\n'))

          # Quitar numeración plana duplicada de notas.
          t = re.sub(r'(<a id="fn-main-(\d+)"></a><sup>\2</sup>)\s+\d+\s+', r'\1 ', t)

          # Una sola nota editorial no numérica para la tensión terminológica/doctrinal del mapa.
          call = 'es ya la primera mediación, el momento en que el ego se determina a sí mismo antes de que ningún acto externo haya ocurrido todavía.'
          call_repl = call + '<sup id="fnref-ed-cap5"><a href="#fn-ed-cap5">†</a></sup>'
          if call not in t:
              raise SystemExit('No se encontró el pasaje de primera mediación para la nota editorial.')
          t = t.replace(call, call_repl, 1)
          ednote = ('<a id="fn-ed-cap5"></a><sup>†</sup> **Nota editorial.** El mapa maestro registra una tensión de continuidad terminológica y doctrinal en torno a «primera mediación». '
                    'En *Caos*, la expresión designa la determinación intencional que orienta la voluntad hacia el acto y funciona como fundamento de responsabilidad; obras posteriores introducen la expresión retrospectiva «primera mediación en sentido material» o redistribuyen el fundamento de responsabilidad entre φ₁ y φ₂. '
                    'Como esas equivalencias no están adjudicadas de forma definitiva, esta edición conserva sin sustitución el uso interno de *Caos*.')
          marker = '<a id="fn-main-106"></a><sup>106</sup>'
          if marker not in t:
              raise SystemExit('No se encontró la nota 106 para insertar la nota editorial.')
          t = t.replace(marker, ednote + '\n\n' + marker, 1)

          # No usar guion medio y limpiar espacios.
          t = t.replace('–', '-')
          t = re.sub(r'[ \t]+\n', '\n', t)
          t = re.sub(r'\n{4,}', '\n\n\n', t).rstrip() + '\n'

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(t, encoding='utf-8')

          refs = [int(x) for x in re.findall(r'href="#fn-main-(\d+)"', t)]
          notes = [int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>', t)]
          print('MISSING_REFERENCED_NOTES', sorted(set(refs)-set(notes)))
          print('ORPHAN_NOTES', sorted(set(notes)-set(refs)))
          print('EM_DASHES', t.count('—'), 'EN_DASHES', t.count('–'))
          print('REPLACEMENT', t.count('�'), 'BOX', t.count('□'))
          print('SUSPICIOUS_COMPOUNDS', sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b', t))))
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line:
                  print(f'DASH_LINE {i}: {line[:1800]}')
          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)):
              raise SystemExit('La auditoría de notas no quedó consistente.')
          if '–' in t or '�' in t or '□' in t:
              raise SystemExit('Persisten caracteres prohibidos o corruptos.')
      - name: Guardar normalización y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalizar-caos-cap5.yml
          git add 'corpus/normalización/caos/capitulo-05.md'
          git commit -m '[MANT][NORMALIZACION] Normalizar capítulo 5 de Caos'
          git push