name: Analista Fase 13 - JSON maestro del corpus

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/README.md"
      - "analista/FASES.md"
      - "analista/config/clausura-descriptiva.yaml"
      - "analista/generado/fase10/almacenamiento-fase10.json"
      - "analista/generado/fase11/almacenamiento-fase11.json"
      - "analista/generado/fase12/almacenamiento-fase12.json"
      - "analista/esquema/maestro-corpus-fase13-v1.0.0.schema.json"
      - "analista/esquema/concepto-maestro-corpus-fase13-v1.0.0.schema.json"
      - "analista/motores/ensamblador_maestro_corpus_fase13.py"
      - "analista/pruebas/validar_maestro_corpus_fase13.py"
      - "analista/pruebas/validar_cierre_fase13.py"
      - ".github/workflows/analista-fase13-cierre.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analista-fase13-cierre-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cierre-fase13:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema

      - name: Validar regresiones epistemológicas del maestro del corpus
        run: python analista/pruebas/validar_maestro_corpus_fase13.py

      - name: Restaurar los 20 maestros cerrados de Fase 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json,shlex
          from pathlib import Path
          data=json.loads(Path('analista/generado/fase10/almacenamiento-fase10.json').read_text(encoding='utf-8'))
          if data.get('fase') != 10 or data.get('gate',{}).get('fase10_cerrada') is not True:
              raise SystemExit('Fase 13 requiere Fase 10 cerrada')
          s=data['almacenamiento']
          for k,v in [('TAG10',s['release_tag']),('ASSET10',s['asset']),('SHA10',s['asset_sha256'])]:
              print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          gh release download "${TAG10}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET10}" --output fase10.zip
          test "$(sha256sum fase10.zip | awk '{print $1}')" = "${SHA10}"
          mkdir -p analista/generado
          unzip -qo fase10.zip 'maestros/*' -d analista/generado
          test "$(find analista/generado/maestros -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 20
          rm -f fase10.zip

      - name: Restaurar los nueve productos cerrados de Fase 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json,shlex
          from pathlib import Path
          data=json.loads(Path('analista/generado/fase11/almacenamiento-fase11.json').read_text(encoding='utf-8'))
          if data.get('fase') != 11 or data.get('gate',{}).get('fase11_cerrada') is not True:
              raise SystemExit('Fase 13 requiere Fase 11 cerrada')
          s=data['almacenamiento']
          for k,v in [('TAG11',s['release_tag']),('ASSET11',s['asset']),('SHA11',s['asset_sha256'])]:
              print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          gh release download "${TAG11}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET11}" --output fase11.zip
          test "$(sha256sum fase11.zip | awk '{print $1}')" = "${SHA11}"
          unzip -qo fase11.zip 'fase11/*' -d analista/generado
          test -f analista/generado/fase11/cierre-fase11.json
          rm -f fase11.zip

      - name: Restaurar los expedientes auditados cerrados de Fase 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json,shlex
          from pathlib import Path
          data=json.loads(Path('analista/generado/fase12/almacenamiento-fase12.json').read_text(encoding='utf-8'))
          if data.get('fase') != 12 or data.get('gate',{}).get('fase12_cerrada') is not True:
              raise SystemExit('Fase 13 requiere Fase 12 cerrada')
          s=data['almacenamiento']
          for k,v in [('TAG12',s['release_tag']),('ASSET12',s['asset']),('SHA12',s['asset_sha256'])]:
              print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          gh release download "${TAG12}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET12}" --output fase12.zip
          test "$(sha256sum fase12.zip | awk '{print $1}')" = "${SHA12}"
          unzip -qo fase12.zip 'fase12/*' -d analista/generado
          test -f analista/generado/fase12/cierre-fase12.json
          rm -f fase12.zip

      - name: Ensamblar el JSON maestro del corpus
        run: |
          python analista/motores/ensamblador_maestro_corpus_fase13.py \
            --fase12-dir analista/generado/fase12 \
            --almacenamiento-fase12 analista/generado/fase12/almacenamiento-fase12.json \
            --fase11-dir analista/generado/fase11 \
            --almacenamiento-fase11 analista/generado/fase11/almacenamiento-fase11.json \
            --manifest-fase10 analista/generado/fase10/almacenamiento-fase10.json \
            --maestros-dir analista/generado/maestros \
            --salida-dir analista/generado/fase13

      - name: Validar trazabilidad completa, clausura y reproducibilidad de Fase 13
        run: |
          python analista/pruebas/validar_cierre_fase13.py \
            --fase12-dir analista/generado/fase12 \
            --almacenamiento-fase12 analista/generado/fase12/almacenamiento-fase12.json \
            --fase11-dir analista/generado/fase11 \
            --almacenamiento-fase11 analista/generado/fase11/almacenamiento-fase11.json \
            --manifest-fase10 analista/generado/fase10/almacenamiento-fase10.json \
            --maestros-dir analista/generado/maestros \
            --salida-dir analista/generado/fase13 \
            --cierre analista/generado/fase13/cierre-fase13.json

      - name: Empaquetar productos determinísticamente
        run: |
          python - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          root=Path('analista/generado')
          out=Path('analista-fase13-cierre-v1.0.0.zip')
          files=sorted(p for p in (root/'fase13').iterdir() if p.is_file())
          with ZipFile(out,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  info=ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0))
                  info.compress_type=ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xffff)<<16
                  with p.open('rb') as src,z.open(info,'w',force_zip64=True) as dst:
                      shutil.copyfileobj(src,dst,1024*1024)
          h=hashlib.sha256()
          with out.open('rb') as f:
              for chunk in iter(lambda: f.read(1024*1024),b''):
                  h.update(chunk)
          print(f'F13_ZIP_SHA256={h.hexdigest()}')
          print(f'F13_ZIP_BYTES={out.stat().st_size}')
          print(f'F13_ARCHIVOS={len(files)}')
          PY

      - name: Publicar evidencia durable de Fase 13
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: analista-fase13-cierre-v1.0.0
          ASSET: analista-fase13-cierre-v1.0.0.zip
        run: |
          set -euo pipefail
          digest="$(sha256sum "${ASSET}" | awk '{print $1}')"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .target_commitish)"
            test "${target}" = "${GITHUB_SHA}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Analista documental — cierre Fase 13 v1.0.0" \
              --notes "JSON maestro del corpus construido sobre expedientes F12 auditados y registros de origen cerrados. Fórmulas por coocurrencia sólo para recuperación; restricciones sólo por referencia explícita. No establece identidad conceptual interobra ni resolución doctrinal."
          fi
          gh release upload "${RELEASE_TAG}" "${ASSET}" --clobber --repo "${GITHUB_REPOSITORY}"
          remote_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".assets[] | select(.name==\"${ASSET}\") | .digest")"
          test "${remote_digest}" = "sha256:${digest}"
          echo "Release Fase 13 persistido: ${remote_digest}"

      - name: Persistir gate y manifiesto ligero en Git
        env:
          RELEASE_TAG: analista-fase13-cierre-v1.0.0
          ASSET: analista-fase13-cierre-v1.0.0.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'analista/motores')
          from ensamblador_maestro_corpus_fase13 import sha256_file, write_json
          root=Path('analista/generado/fase13')
          asset=Path(os.environ['ASSET'])
          closure_bytes=(root/'cierre-fase13.json').read_bytes()
          closure=json.loads(closure_bytes)
          storage={
              'version':'1.0.0',
              'fase':13,
              'estado':'evidencia_validada_persistida_fuera_de_blobs_git',
              'gate':{
                  'fase13_cerrada':True,
                  'head_sha':os.environ['GITHUB_SHA'],
                  'maestros_obra':closure['maestros_obra'],
                  'conceptos':closure['conceptos'],
                  'predicaciones_trazables':closure['predicaciones_trazables'],
                  'formulas':closure['formulas'],
                  'restricciones':closure['restricciones'],
                  'cierre_sha256':hashlib.sha256(closure_bytes).hexdigest(),
              },
              'origen_fase12':closure['origen_fase12'],
              'origen_fase11':closure['origen_fase11'],
              'origen_fase10':closure['origen_fase10'],
              'almacenamiento':{
                  'tipo':'github_release_asset_zip',
                  'release_tag':os.environ['RELEASE_TAG'],
                  'asset':os.environ['ASSET'],
                  'asset_sha256':sha256_file(asset),
                  'asset_bytes':asset.stat().st_size,
                  'raiz_al_extraer':'analista/generado',
                  'raiz_contenida':'fase13',
              },
              'productos':[
                  {'tipo':'maestro_corpus','ruta_en_zip':'fase13/maestro-corpus.json','sha256':closure['maestro_sha256']},
                  {'tipo':'conceptos_maestro_corpus','ruta_en_zip':'fase13/'+closure['productos']['conceptos']['ruta'],'sha256':closure['productos']['conceptos']['sha256'],'registros':closure['productos']['conceptos']['registros']},
                  {'tipo':'formulas_corpus','ruta_en_zip':'fase13/'+closure['productos']['formulas']['ruta'],'sha256':closure['productos']['formulas']['sha256'],'registros':closure['productos']['formulas']['registros']},
                  {'tipo':'restricciones_corpus','ruta_en_zip':'fase13/'+closure['productos']['restricciones']['ruta'],'sha256':closure['productos']['restricciones']['sha256'],'registros':closure['productos']['restricciones']['registros']},
              ],
              'clausura_descriptiva':closure['clausura_descriptiva'],
          }
          write_json(root/'almacenamiento-fase13.json',storage)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/fase13/cierre-fase13.json \
                  analista/generado/fase13/cierre-fase13.json.sha256 \
                  analista/generado/fase13/almacenamiento-fase13.json \
                  analista/generado/fase13/almacenamiento-fase13.json.sha256
          git commit -m "Persistir cierre descriptivo de Fase 13"
          git push origin HEAD:analisis-textual-v0.1
