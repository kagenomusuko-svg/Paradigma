name: Pulir temporalmente Caos apéndice 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pulir-caos-ap3.yml'

permissions:
  contents: write

jobs:
  pulir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolver rayas residuales y validar
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('corpus/normalización/caos/apendice-03.md')
          t=p.read_text(encoding='utf-8')
          reps={
            'El sujeto no se identifica con ningún tipo de sustancia —no es el alma, ni la conciencia trascendental, ni el cerebro.':'El sujeto no se identifica con ningún tipo de sustancia: no es el alma, ni la conciencia trascendental, ni el cerebro.',
            'La mediación no es el «puente» entre voluntad y mundo —imagen que el libro rechaza explícitamente.':'La mediación no es el «puente» entre voluntad y mundo, imagen que el libro rechaza explícitamente.',
            'es el mismo ego que actúa hoy —no en el sentido de identidad sustancial sino en el sentido de continuidad funcional acumulativa.':'es el mismo ego que actúa hoy, no en el sentido de identidad sustancial sino en el sentido de continuidad funcional acumulativa.',
            'del *ego parcial* —que tiene primera mediación pero cuya segunda mediación falla, de modo que actúa sin construirse.':'del *ego parcial*, que tiene primera mediación pero cuya segunda mediación falla, de modo que actúa sin construirse.',
            '«Necesaria»: sin doble mediación no hay ego —hay sujeto que podría ser ego pero que no lo es todavía.':'«Necesaria»: sin doble mediación no hay ego; hay sujeto que podría ser ego pero que no lo es todavía.',
            'la estructura de la primera mediación del acto —lo que hace que el acto sea un acto y no solo un evento.':'la estructura de la primera mediación del acto, lo que hace que el acto sea un acto y no solo un evento.',
            '(a) *pasado* como integral acumulativa —todo lo que el ego fue; (b) *presente* como colapso en curso —el acto que está ocurriendo ahora; (c) *futuro* como campo de posibilidades —el caos que el próximo colapso determinará.':'(a) *pasado* como integral acumulativa, todo lo que el ego fue; (b) *presente* como colapso en curso, el acto que está ocurriendo ahora; (c) *futuro* como campo de posibilidades, el caos que el próximo colapso determinará.',
            'cada colapso ocurre siempre ahora, siempre en el único momento en que puede ocurrir —el presente.':'cada colapso ocurre siempre ahora, siempre en el único momento en que puede ocurrir: el presente.',
          }
          for a,b in reps.items(): t=t.replace(a,b)
          # Cualquier raya residual se reporta, no se guarda silenciosamente.
          bad_lines=[]
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line: bad_lines.append((i,line))
          refs=[int(x) for x in re.findall(r'href="#fn-app-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-app-(\d+)"></a>',t)]
          edrefs=set(re.findall(r'href="#(fn-ed-ap3-[^"]+)"',t))
          edanchors=set(re.findall(r'<a id="(fn-ed-ap3-[^"]+)"></a>',t))
          print('DASH_LINES',len(bad_lines))
          for i,line in bad_lines: print(f'DASH {i}: {line[:1800]}')
          print('PROHIBITED',{c:t.count(c) for c in ['–','□','�']})
          print('MISSING',sorted(set(refs)-set(notes)),'ORPHAN',sorted(set(notes)-set(refs)))
          print('MISSING_34_43',[n for n in range(34,44) if n not in notes])
          print('MISSING_ED',sorted(edrefs-edanchors),'ORPHAN_ED',sorted(edanchors-edrefs))
          if bad_lines or any(c in t for c in ['–','□','�']):
              raise SystemExit('Persisten rayas o caracteres prohibidos.')
          if set(refs)!=set(notes) or [n for n in range(34,44) if n not in notes] or edrefs!=edanchors:
              raise SystemExit('Auditoría de notas falló.')
          p.write_text(t.rstrip()+'\n',encoding='utf-8')
      - name: Guardar pulido y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pulir-caos-ap3.yml
          git add 'corpus/normalización/caos/apendice-03.md'
          git commit -m '[MANT][NORMALIZACION] Pulir ortotipografía de Caos apéndice 3'
          git push
