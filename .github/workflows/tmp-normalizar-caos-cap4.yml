name: Normalizar temporalmente Caos capítulo 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalizar-caos-cap4.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalizar capítulo y reparar notas
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata

          src = Path('corpus/libros/caos/capitulo-04.md')
          dst = Path('corpus/normalización/caos/capitulo-04.md')
          original = src.read_text(encoding='utf-8')
          text = unicodedata.normalize('NFC', original)

          text = text.replace(
              '*Células, individuos y el problema de Dios «Somos parte del todo, pero el todo no es ninguna de sus partes.»* — Miguel Hilario Olvera Aguilar',
              '*Células, individuos y el problema de Dios*\n\n«Somos parte del todo, pero el todo no es ninguna de sus partes.» —Miguel Hilario Olvera Aguilar'
          )

          # Correcciones objetivas y compuestos ortográficos inequívocos.
          text = text.replace('co-emergencia', 'coemergencia')
          text = text.replace('co-determinan', 'codeterminan')
          text = text.replace('co-determina', 'codetermina')
          text = text.replace('La limitación del campo es real y significativa: condicionan mis posibilidades', 'La limitación del campo es real y significativa: condiciona mis posibilidades')

          # Incisos cerrados con raya: convertirlos a paréntesis, sin tocar la atribución del epígrafe.
          inciso = re.compile(r'\s—\s*([^—\n]{1,420}?)\s*—(?=[,.;:?!)]|\s)')
          while inciso.search(text):
              text = inciso.sub(lambda m: ' (' + m.group(1).strip() + ')', text)

          # Comillas angulares en prosa, sin alterar atributos HTML.
          def quotes_line(line: str) -> str:
              out=[]; in_tag=False; opening=True
              for ch in line:
                  if ch == '<': in_tag=True
                  if ch == '"' and not in_tag:
                      out.append('«' if opening else '»'); opening = not opening
                  else:
                      out.append(ch)
                  if ch == '>': in_tag=False
              return ''.join(out)
          text = '\n'.join(quotes_line(line) for line in text.split('\n'))

          # Reparar llamadas huérfanas 93 y 102.
          text = text.replace('<sup>93</sup>', '<sup id="fnref-main-93"><a href="#fn-main-93">93</a></sup>', 1)
          text = text.replace('<sup>102</sup>', '<sup id="fnref-main-102"><a href="#fn-main-102">102</a></sup>', 1)

          # Retirar numeración plana duplicada/desfasada de las notas existentes.
          text = re.sub(r'(<a id="fn-main-(\d+)"></a><sup>\2</sup>)\s+\d+\s+', r'\1 ', text)

          note93 = ('<a id="fn-main-93"></a><sup>93</sup> **Nota editorial.** El mapa maestro registra aquí una tensión real de continuidad doctrinal. '
                    '*Caos* sitúa el origen de la responsabilidad en la primera mediación (φ₁); *Afrodita Areia I* vincula la responsabilidad a la asunción en φ₂, '
                    'mientras *Afrodita Areia IV* vuelve a fundar la imputación exterior en φ₁. El mismo mapa advierte además que la expresión retrospectiva «primera mediación en sentido material» '
                    'empleada en obras posteriores no aparece en la fuente canónica de *Caos*. Esta edición conserva, por tanto, el sentido interno de «primera mediación» propio de esta obra y no adjudica retrospectivamente la discrepancia.')
          marker94 = '<a id="fn-main-94"></a><sup>94</sup>'
          if marker94 not in text:
              raise SystemExit('No se encontró la nota 94 para insertar la nota editorial 93.')
          text = text.replace(marker94, note93 + '\n\n' + marker94, 1)

          note102 = ('<a id="fn-main-102"></a><sup>102</sup> Véase la nota 96, sobre Viktor Frankl y *El hombre en busca de sentido* (1946).')
          marker103 = '<a id="fn-main-103"></a><sup>103</sup>'
          if marker103 not in text:
              raise SystemExit('No se encontró la nota 103 para insertar la nota 102.')
          text = text.replace(marker103, note102 + '\n\n' + marker103, 1)

          # No usar guion medio; limpieza de espacios.
          text = text.replace('–', '-')
          text = re.sub(r'[ \t]+\n', '\n', text)
          text = re.sub(r'\n{4,}', '\n\n\n', text).rstrip() + '\n'

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text, encoding='utf-8')

          refs = [int(x) for x in re.findall(r'href="#fn-main-(\d+)"', text)]
          notes = [int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>', text)]
          print('SOURCE_CHARS:', len(original))
          print('NORMALIZED_CHARS:', len(text))
          print('REFS_UNIQUE:', sorted(set(refs)))
          print('NOTES:', notes)
          print('MISSING_REFERENCED_NOTES:', sorted(set(refs)-set(notes)))
          print('ORPHAN_NOTES:', sorted(set(notes)-set(refs)))
          print('REMAINING_EM_DASHES:', text.count('—'))
          print('REMAINING_EN_DASHES:', text.count('–'))
          print('REPLACEMENT_GLYPHS:', text.count('�'), 'BOX_GLYPHS:', text.count('□'))
          print('SUSPICIOUS_COMPOUNDS:', sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b', text))))
          for i,line in enumerate(text.splitlines(),1):
              if '—' in line:
                  print(f'DASH_LINE {i}: {line[:1800]}')

          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)):
              raise SystemExit('La auditoría de notas no quedó consistente.')
          if '–' in text or '�' in text or '□' in text:
              raise SystemExit('Persisten caracteres prohibidos o corruptos.')

      - name: Guardar normalización y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalizar-caos-cap4.yml
          git add 'corpus/normalización/caos/capitulo-04.md'
          git commit -m '[MANT][NORMALIZACION] Normalizar capítulo 4 de Caos'
          git push
