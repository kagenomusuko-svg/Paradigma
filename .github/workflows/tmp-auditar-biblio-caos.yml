name: Auditar temporalmente referencias de Caos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auditar-biblio-caos.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar autor-año de notas con bibliografía
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata

          base=Path('corpus/normalización/caos')
          bib=(base/'98-bibliografia.md').read_text(encoding='utf-8')
          def fold(s):
              return ''.join(c for c in unicodedata.normalize('NFD',s.lower()) if unicodedata.category(c)!='Mn')
          bibf=fold(bib)

          # Detecta referencias con forma Apellido, Nombre ... año en las notas.
          pat=re.compile(r'\b([A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñïëöäßØø-]{2,}),\s+[A-ZÁÉÍÓÚÜÑ][^\n]{0,180}?\b((?:1[5-9]|20)\d{2})\b')
          pairs={}
          for p in sorted(base.glob('*.md')):
              if p.name=='98-bibliografia.md': continue
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '<a id="fn-' not in line or '**Nota editorial.**' in line: continue
                  clean=re.sub(r'<[^>]+>','',line)
                  for m in pat.finditer(clean):
                      surname,year=m.group(1),m.group(2)
                      # falso positivo frecuente: apellido dentro de título inmediatamente tras otro autor.
                      key=(surname,year)
                      pairs.setdefault(key,[]).append((p.name,clean[:650]))

          missing=[]
          for (surname,year),ctx in sorted(pairs.items()):
              sf=fold(surname)
              # Exige presencia conjunta aproximada: apellido y año en alguna misma entrada bibliográfica.
              hit=False
              for line in bib.splitlines():
                  lf=fold(line)
                  if line.startswith('**') and sf in lf and year in line:
                      hit=True; break
              if not hit:
                  missing.append((surname,year,ctx))

          print('PARES_AUTOR_ANO_FALTANTES',len(missing))
          for surname,year,ctxs in missing:
              print(f'PAIR {surname} {year}')
              for fn,ctx in ctxs[:2]: print(' ',fn,ctx)

      - name: Retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-auditar-biblio-caos.yml
          git commit -m '[MANT] Retirar auditoría temporal de bibliografía de Caos'
          git push
