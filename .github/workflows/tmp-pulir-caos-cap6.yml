name: Pulir temporalmente Caos capítulo 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pulir-caos-cap6.yml'

permissions:
  contents: write

jobs:
  pulir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cerrar ortotipografía, orden de notas y rayas
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('corpus/normalización/caos/capitulo-06.md')
          t=p.read_text(encoding='utf-8')
          reps={
            'No una metáfora, no una aproximación —una fórmula en el sentido más riguroso':'No una metáfora, no una aproximación: una fórmula en el sentido más riguroso',
            'no es un impulso bruto que precede al acto sin definirlo —un mero querer sin dirección':'no es un impulso bruto que precede al acto sin definirlo: un mero querer sin dirección',
            'tenía la capacidad de la primera mediación —que tenía la capacidad de orientar su voluntad':'tenía la capacidad de la primera mediación, es decir, la capacidad de orientar su voluntad',
            'hubiera podido actuar de otra manera —que hubiera tenido alternativas disponibles.':'hubiera podido actuar de otra manera, es decir, que hubiera tenido alternativas disponibles.',
            'Requiere que la primera mediación haya ocurrido —que el acto haya sido producido':'Requiere que la primera mediación haya ocurrido: que el acto haya sido producido',
            'la acción es el acto del ego —la determinación producida desde la primera mediación.':'la acción es el acto del ego: la determinación producida desde la primera mediación.',
            'y la ipseidad —el sujeto que se mantiene mediante el compromiso.':'y la ipseidad, el sujeto que se mantiene mediante el compromiso.',
            'produce colapsos de generosidad — no la propiedad estática':'produce colapsos de generosidad, no la propiedad estática',
            'la akrasia —la debilidad de la voluntad.':'la akrasia (la debilidad de la voluntad).',
            'integrar el acto a la integral —se niega a reconocer':'integrar el acto a la integral; se niega a reconocer',
            'La voluntad orienta —primera mediación. El acto colapsa —determinación irreversible en el mundo. El acto retorna —segunda mediación.':'La voluntad orienta: primera mediación. El acto colapsa: determinación irreversible en el mundo. El acto retorna: segunda mediación.',
            'No en el resultado —que puede depender de cadenas causales que el ego no controla. No en las consecuencias —que la suerte moral puede modificar':'No en el resultado, que puede depender de cadenas causales que el ego no controla. No en las consecuencias, que la suerte moral puede modificar',
            'Lo que importa moralmente es la máxima que rige el acto —la intención que lo orienta.':'Lo que importa moralmente es la máxima que rige el acto: la intención que lo orienta.',
            'contra el «principio de las posibilidades alternativas» —la tesis de que alguien es responsable':'contra el «principio de las posibilidades alternativas», la tesis de que alguien es responsable',
            'sino hacia atrás —en la historia del agente que lo produjo.':'sino hacia atrás, en la historia del agente que lo produjo.',
            'fuerza al sujeto a una elección —a «apostar» por el acontecimiento':'fuerza al sujeto a una elección: a «apostar» por el acontecimiento',
            'la integración del acontecimiento a la integral del ego —el proceso por el cual':'la integración del acontecimiento a la integral del ego, el proceso por el cual',
            'juzga retrospectivamente inadecuada —el acto no correspondió':'juzga retrospectivamente inadecuada: el acto no correspondió',
            'puede fallar de la manera que Nietzsche describe —cuando el ego no integra':'puede fallar de la manera que Nietzsche describe: cuando el ego no integra',
            'evalúa los actos por sus resultados —no por las intenciones que los produjeron.':'evalúa los actos por sus resultados, no por las intenciones que los produjeron.',
            'el campo que ayer es incluyó entre sus determinaciones.':'el campo que ayer incluyó entre sus determinaciones.',
            'Aristoteles, De anima':'Aristóteles, De anima',
            'actuó acraticamente':'actuó acráticamente',
            'no niega la regresión sino cambia la pregunta':'no niega la regresión sino que cambia la pregunta',
          }
          for a,b in reps.items(): t=t.replace(a,b)
          t=re.sub(r'actúa por deber\s*—\s*no en conformidad con el deber sino por deber', 'actúa por deber, no en conformidad con el deber sino por deber', t)

          n149='<a id="fn-main-149"></a><sup>149</sup> Véase la nota 145, sobre Freud y la compulsión de repetición como figura del fallo de integración.'
          n150='<a id="fn-main-150"></a><sup>150</sup> Véase la nota 134, sobre Sartre; aquí la mala fe se aplica específicamente al problema de la segunda mediación y de la apropiación del acto como propio.'
          t=t.replace(n149+'\n\n'+n150+'\n\n','')
          m151='<a id="fn-main-151"></a><sup>151</sup>'
          t=t.replace(m151,n149+'\n\n'+n150+'\n\n'+m151,1)

          math_call='La integral acumulativa del ego (el ego como integral de todos sus colapsos) tiene la estructura de lo que en cálculo se llama integral definida:'
          t=t.replace(math_call,math_call+'<sup id="fnref-ed-cap6-formal"><a href="#fn-ed-cap6-formal">‡</a></sup>',1)
          math_note='<a id="fn-ed-cap6-formal"></a><sup>‡</sup> **Nota editorial.** El mapa maestro mantiene abierta una revisión formal sobre el tipado de esta integral y de φ₂: *Caos* usa I como valor integral, estado acumulativo y objeto actualizable, mientras formalizaciones posteriores distinguen con mayor precisión el espacio de estados y la operación de actualización. Esta edición no regulariza retroactivamente esa notación; conserva la formulación de *Caos* y señala únicamente la tensión formal.'
          m130='<a id="fn-main-130"></a><sup>130</sup>'
          t=t.replace(m130,math_note+'\n\n'+m130,1)

          t=t.replace('identidad-idem','identidad *idem*').replace('identidad-ipse','identidad *ipse*')
          t=t.replace('idem-identidad','identidad *idem*').replace('ipse-identidad','identidad *ipse*')

          dash=[]
          for i,line in enumerate(t.splitlines(),1):
            if '—' in line and not line.startswith('«No basta con querer. No basta con hacer. El ego es lo que ocurre entre ambos y lo que ocurre después.» —Miguel Hilario Olvera Aguilar'):
              dash.append((i,line))
          refs=[int(x) for x in re.findall(r'href="#fn-main-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>',t)]
          print('UNRESOLVED_DASH_LINES',len(dash))
          print('MISSING_REFERENCED_NOTES',sorted(set(refs)-set(notes)))
          print('ORPHAN_NOTES',sorted(set(notes)-set(refs)))
          print('NOTE_SEQUENCE',[n for n in range(130,156) if n not in notes])
          print('EM_DASHES',t.count('—'),'EN_DASHES',t.count('–'))
          if dash:
            for i,line in dash: print(f'DASH {i}: {line[:1500]}')
            raise SystemExit('Quedaron rayas de prosa sin resolver.')
          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)) or [n for n in range(130,156) if n not in notes]: raise SystemExit('Auditoría de notas falló.')
          if '–' in t or '�' in t or '□' in t: raise SystemExit('Persisten caracteres prohibidos o corruptos.')
          p.write_text(t,encoding='utf-8')
      - name: Guardar pulido y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pulir-caos-cap6.yml
          git add 'corpus/normalización/caos/capitulo-06.md'
          git commit -m '[MANT][NORMALIZACION] Pulir ortotipografía de Caos capítulo 6'
          git push
