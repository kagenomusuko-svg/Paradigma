name: Analista Fase 8 - calibracion

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/calibracion/**"
      - "analista/pruebas/validar_infra_calibracion_fase8.py"
      - "analista/pruebas/validar_patron_oro_fase8.py"
      - "analista/pruebas/validar_umbrales_fase8.py"
      - "analista/pruebas/validar_calibracion_conceptos_fase8.py"
      - "analista/pruebas/validar_calibracion_definiciones_fase8.py"
      - "analista/pruebas/validar_calibracion_afirmaciones_fase8.py"
      - "analista/pruebas/validar_calibracion_relaciones_fase8.py"
      - "analista/pruebas/validar_conceptos_fase4a.py"
      - "analista/pruebas/validar_definiciones_fase4b.py"
      - "analista/pruebas/validar_afirmaciones_fase4c.py"
      - "analista/pruebas/validar_relaciones_fase4e.py"
      - "analista/motores/conceptos.py"
      - "analista/motores/definiciones.py"
      - "analista/motores/afirmaciones.py"
      - "analista/motores/formulas.py"
      - "analista/motores/relaciones_explicitas.py"
      - "analista/motores/limitadores.py"
      - "analista/generado/unidades.jsonl"
      - "analista/generado/apariciones-conceptuales.jsonl"
      - "analista/generado/conceptos.jsonl"
      - "analista/generado/definiciones.jsonl"
      - "analista/generado/afirmaciones-candidatas.jsonl"
      - "analista/generado/relaciones-explicitas.jsonl"
      - ".github/workflows/analista-fase8-calibracion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - name: Materializar gold manual reproducible de 4A
        run: python analista/calibracion/materializar_oro_conceptos.py
      - name: Materializar gold manual reproducible de 4C
        run: python analista/calibracion/materializar_oro_afirmaciones.py
      - name: Reconstruir producto 4A calibrado
        run: python analista/motores/conceptos.py
      - name: Validar producto real 4A
        run: python analista/pruebas/validar_conceptos_fase4a.py
      - name: Reconstruir producto 4B calibrado
        run: python analista/motores/definiciones.py
      - name: Validar producto real 4B
        run: python analista/pruebas/validar_definiciones_fase4b.py
      - name: Reconstruir producto 4C calibrado
        run: python analista/motores/afirmaciones.py
      - name: Validar producto real 4C
        run: python analista/pruebas/validar_afirmaciones_fase4c.py
      - name: Reconstruir producto 4D calibrado
        run: python analista/motores/formulas.py
      - name: Validar producto real 4D
        run: python analista/pruebas/validar_formulas_fase4d.py
      - name: Reconstruir producto 4E calibrado
        run: python analista/motores/relaciones_explicitas.py
      - name: Validar producto real 4E
        run: python analista/pruebas/validar_relaciones_fase4e.py
      - name: Validar patrón de oro manifestado
        run: python analista/pruebas/validar_patron_oro_fase8.py
      - name: Validar infraestructura de calibración
        run: python analista/pruebas/validar_infra_calibracion_fase8.py
      - name: Validar calibración de 4A
        run: python analista/pruebas/validar_calibracion_conceptos_fase8.py
      - name: Validar calibración de 4B
        run: python analista/pruebas/validar_calibracion_definiciones_fase8.py
      - name: Validar calibración de 4C
        run: python analista/pruebas/validar_calibracion_afirmaciones_fase8.py
      - name: Validar calibración de 4E
        run: python analista/pruebas/validar_calibracion_relaciones_fase8.py
      - name: Probar gate de umbrales
        run: python analista/pruebas/validar_umbrales_fase8.py
      - name: Evaluar motores ya anotados
        run: python analista/calibracion/evaluar.py
      - name: Comprobar cierre cuantitativo
        id: gate
        run: python analista/calibracion/comprobar_umbrales.py --salida analista/generado/cierre-fase8.json
      - name: Publicar evidencia de calibración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analista-fase8-calibracion
          path: |
            analista/calibracion/patron-oro-conceptos-desafio.jsonl
            analista/calibracion/patron-oro-conceptos-general.jsonl
            analista/calibracion/patron-oro-afirmaciones.jsonl
            analista/generado/apariciones-conceptuales.jsonl
            analista/generado/conceptos.jsonl
            analista/generado/cobertura-conceptos.jsonl
            analista/generado/definiciones.jsonl
            analista/generado/cobertura-definiciones.jsonl
            analista/generado/afirmaciones-candidatas.jsonl
            analista/generado/cobertura-afirmaciones.jsonl
            analista/generado/formulas-candidatas.jsonl
            analista/generado/cobertura-formulas.jsonl
            analista/generado/relaciones-explicitas.jsonl
            analista/generado/cobertura-relaciones.jsonl
            analista/generado/reporte-calibracion.json
            analista/generado/cierre-fase8.json
          if-no-files-found: warn
