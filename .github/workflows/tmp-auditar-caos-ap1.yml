name: Auditar temporalmente Caos apéndice 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-auditar-caos-ap1.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auditar apéndice y mapa
        shell: python
        run: |
          from pathlib import Path
          import json, re
          p=Path('corpus/libros/caos/apendice-01.md')
          t=p.read_text(encoding='utf-8')
          refs=[int(x) for x in re.findall(r'href="#fn-main-(\d+)"',t)]
          plain=[int(x) for x in re.findall(r'<sup>(\d+)</sup>',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>',t)]
          print('CHARS',len(t),'LINES',len(t.splitlines()))
          print('LINKED_REFS',sorted(set(refs)))
          print('PLAIN_SUP_REFS',plain)
          print('NOTES',notes)
          print('MISSING_LINKED',sorted(set(refs)-set(notes)))
          print('PLAIN_WITHOUT_NOTE',sorted(set(plain)-set(notes)))
          print('ORPHAN_NOTES',sorted(set(notes)-set(refs)-set(plain)))
          if notes or refs or plain:
              nums=notes+refs+plain
              print('RANGE',min(nums),max(nums),'MISSING_NOTES',[n for n in range(min(nums),max(nums)+1) if n not in notes])
          print('EM_DASHES',t.count('—'),'EN_DASHES',t.count('–'),'REPL',t.count('�'),'BOX',t.count('□'))
          print('SUSPICIOUS_COMPOUNDS',sorted(set(re.findall(r'\b[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+-[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+\b',t))))
          for i,line in enumerate(t.splitlines(),1):
              if '—' in line:
                  print(f'DASH {i}: {line[:1400]}')
          mapa=json.loads(Path('mapa/mapa-maestro.json').read_text(encoding='utf-8'))
          keys=('formal','topolog','integral','límite','limite','infinito','deriv','función','funcion','acumulación','acumulacion','ego')
          for i,item in enumerate(mapa.get('review_queue', [])):
              dump=json.dumps(item,ensure_ascii=False).lower()
              if 'ev.caos' in dump and any(k in dump for k in keys):
                  print('MAP_REVIEW',i,json.dumps(item,ensure_ascii=False))
      - name: Retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-auditar-caos-ap1.yml
          git commit -m '[MANT][NORMALIZACION] Retirar auditoría temporal de Caos apéndice 1'
          git push
