name: Rematar Caos capítulo 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-remate-caos-cap7.yml'

permissions:
  contents: write

jobs:
  remate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir secuela gramatical y validar
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('corpus/normalización/caos/capitulo-07.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
            'La causalidad no es una estructura del mundo que inferimos inductivamente de la observación (Hume tiene razón) en que ninguna inferencia inductiva puede producir una conexión necesaria.',
            'La causalidad no es una estructura del mundo que inferimos inductivamente de la observación: Hume tiene razón en que ninguna inferencia inductiva puede producir una conexión necesaria.'
          )
          bad=['(Hume tiene razón) en que','— ',' – ','�','□']
          for x in bad:
              if x in t and x != '— ':
                  raise SystemExit(f'Persistió patrón no deseado: {x}')
          refs=[int(x) for x in re.findall(r'href="#fn-main-(\d+)"',t)]
          notes=[int(x) for x in re.findall(r'<a id="fn-main-(\d+)"></a>',t)]
          if sorted(set(refs)-set(notes)) or sorted(set(notes)-set(refs)) or [n for n in range(156,177) if n not in notes]:
              raise SystemExit('Auditoría de notas falló.')
          if t.count('—') != 1:
              raise SystemExit(f'Rayas largas inesperadas: {t.count("—")}')
          p.write_text(t,encoding='utf-8')
      - name: Guardar remate y retirar flujo temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-remate-caos-cap7.yml
          git add 'corpus/normalización/caos/capitulo-07.md'
          git commit -m '[MANT][NORMALIZACION] Rematar Caos capítulo 7'
          git push
