name: Analista Fase 4E - relaciones explicitas

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/motores/relaciones_explicitas.py"
      - "analista/pruebas/validar_relaciones_fase4e.py"
      - "analista/esquema/**"
      - "analista/generado/fuentes.jsonl"
      - "analista/generado/unidades.jsonl"
      - "analista/generado/conceptos.jsonl"
      - "corpus/libros/afrodita-areia/01-sobre-la-pasion/99-glosario.md"
      - ".github/workflows/analista-fase4e-relaciones.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relaciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - name: Generar relaciones explicitas reales
        run: python analista/motores/relaciones_explicitas.py
      - name: Validar literalidad y clausura relacional
        run: python analista/pruebas/validar_relaciones_fase4e.py
      - uses: actions/upload-artifact@v4
        with:
          name: analista-fase4e-relaciones
          path: |
            analista/generado/relaciones-explicitas.jsonl
            analista/generado/cobertura-relaciones.jsonl
          if-no-files-found: error
      - name: Persistir productos deterministas
        if: github.actor != 'github-actions[bot]'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/relaciones-explicitas.jsonl analista/generado/cobertura-relaciones.jsonl)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/relaciones-explicitas.jsonl analista/generado/cobertura-relaciones.jsonl
          git commit -m "Generar relaciones explícitas de Fase 4E"
          git push origin HEAD:"${TARGET_BRANCH}"
