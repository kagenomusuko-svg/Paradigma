name: Analista Fase 2 - fuentes

on:
  push:
    branches: [analisis-textual-v0.1]
    paths:
      - "analista/motores/fuentes.py"
      - "analista/pruebas/validar_fuentes_fase2.py"
      - "analista/esquema/**"
      - "corpus/catalogo.json"
      - "corpus/fuentes/**"
      - "corpus/libros/**"
      - ".github/workflows/analista-fase2-fuentes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - name: Generar registro real de fuentes
        run: python analista/motores/fuentes.py
      - name: Validar cadena de custodia y contrato
        run: python analista/pruebas/validar_fuentes_fase2.py
      - uses: actions/upload-artifact@v4
        with:
          name: analista-fase2-fuentes
          path: analista/generado/fuentes.jsonl
          if-no-files-found: error
      - name: Persistir producto determinista
        if: github.actor != 'github-actions[bot]'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- analista/generado/fuentes.jsonl)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analista/generado/fuentes.jsonl
          git commit -m "Generar registro de fuentes de Fase 2"
          git push origin HEAD:"${TARGET_BRANCH}"
