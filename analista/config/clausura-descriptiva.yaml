version: "1.1"
principio: clausura_descriptiva

proposito: >-
  Mantener todos los motores, verificadores y auditores del analista en una
  función exclusivamente descriptiva respecto del estado documental del corpus.
  El sistema registra lo que el corpus es y dice; no prescribe lo que debería
  ser, no corrige su doctrina y no completa sus lagunas.

autoridad:
  fuente_autoritativa: corpus
  programa_puede_sustituir_fuente: false
  explicacion_posterior_del_autor_sustituye_fuente: false

operaciones_permitidas:
  - recuperar
  - segmentar
  - registrar
  - citar
  - clasificar_segun_evidencia
  - verificar_evidencia
  - agrupar_predicaciones
  - conservar_multiplicidades
  - comparar_registros
  - auditar_estructura
  - auditar_consistencia_descriptiva
  - reportar

operaciones_prohibidas:
  - completar_doctrina
  - armonizar_doctrina
  - corregir_contenido_conceptual
  - optimizar_formulacion_conceptual
  - resolver_ambiguedades_por_inferencia
  - resolver_contradicciones
  - fusionar_conceptos_por_semejanza
  - convertir_inferencias_en_doctrina
  - sintetizar_predicaciones_en_nueva_tesis
  - recomendar_como_deberia_ser_el_corpus
  - reescribir_contenido_para_hacerlo_mas_coherente

prescripciones_en_la_fuente:
  extraer: true
  conservar_texto_literal: true
  clasificar_funcion_semantica_si_hay_evidencia: true
  generar_prescripciones_nuevas: false
  regla: >-
    Registrar una proposición que contiene lenguaje normativo o modal no vuelve
    prescriptivo al analista. El sistema describe que esa proposición existe y
    conserva su función en contexto. La presencia del significante «debe» no
    determina por sí sola que el analista esté prescribiendo.

estatus_enunciativo:
  obligatorio_en_afirmaciones: true
  categorias_minimas:
    - afirmacion_autoral
    - negacion_autoral
    - cita
    - discurso_referido
    - objecion
    - hipotesis
    - ejemplo
    - pregunta
    - definicion
    - formulacion_condicional
    - caso_contrafactico
    - no_determinado
  regla: >-
    La mera presencia de una proposición en el texto no autoriza a registrarla
    como tesis del autor. Debe conservarse su función enunciativa o quedar como
    no determinada.

semantica:
  significante_no_implica_significado_univoco: true
  decidir_por_palabra_aislada: false
  preservar_contexto: true
  niveles_literalidad:
    - texto_literal
    - normalizacion_formal
    - normalizacion_lexica_para_recuperacion
    - identidad_conceptual_con_evidencia
  normalizacion_lexica:
    uso: recuperacion_de_evidencia
    fusion_conceptual_automatica: false

agregacion:
  agrupar_registros: true
  sintetizar_nueva_proposicion: false
  regla: >-
    Reunir varias predicaciones, definiciones o relaciones bajo un mismo sujeto
    no autoriza a combinarlas en una definición o tesis nueva.

cobertura:
  registrar_unidades_totales: true
  registrar_unidades_procesadas_por_motor: true
  ausencia_de_hallazgo_no_equivale_a_ausencia_en_corpus: true
  expresion_preferida: "NO SE ENCONTRO EVIDENCIA AUDITADA EN EL EXPEDIENTE DISPONIBLE"

calidad_extraccion:
  separar_precision_y_cobertura: true
  patron_de_oro_humano: requerido_para_calibracion
  confianza_numerica_refiere_a: deteccion_o_clasificacion
  confianza_numerica_no_refiere_a: verdad_doctrinal

salidas_prohibidas:
  campos:
    - deberia_ser
    - formulacion_preferible
    - correccion_conceptual_sugerida
    - solucion_doctrinal
    - armonizacion_propuesta

respuesta_ante_ausencia_de_evidencia: "NO DETERMINADO POR EL CORPUS"

revision_calibracion:
  especificacion: analista/REVISION-CALIBRACION.md
  configuracion: analista/config/revision-calibracion.yaml
  rama: revision-calibracion-v0.2
  baseline:
    rama: analisis-textual-v0.1
    commit: 817b05a9a2eaa2643a5a49ec90f881b85a5d572e
    preservar_inmutable: true
  fase_activa: RC-1
  cierre_rc0: analista/revision-calibracion/cierre-RC-0.json
  finalidad: calibrar_motores_existentes_sin_reescribir_doctrina
  auditoria_humana:
    permitida: true
    funcion: verificacion_documental_de_resultados_contra_fuente
    autoridad_doctrinal: false
    intervencion_previa_para_indicar_que_debe_encontrar_el_motor: false
  patron_humano:
    interpretacion: auditoria_documental_posterior_a_la_ejecucion
    patron_doctrinal_autoral_previo: false

invariante_final: >-
  Ningún registro producido por el analista puede contener una afirmación
  doctrinal más fuerte que la evidencia textual verificada de la que procede.
